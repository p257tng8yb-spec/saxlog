    function renderBasicsSection() {
      const editing = state.editMode;
      const cards = state.data.basics.map((item, idx) => {
        const st = getItemStats('basic', item.id);
        const done = isDoneOnDate(state.selectedDate, 'basic', item.id);
        const elapsedClass = st.elapsedDays === 0 ? 'today' : (st.elapsedDays === null || st.elapsedDays >= 3 ? 'warn' : '');
        const bpmText = st.lastBpm ? `♩=${st.lastBpm}` : (item.defaultBpm ? `目安 ♩=${item.defaultBpm}` : 'テンポなし');

        return `
          <div class="menu-card ${done ? 'done-today' : ''} ${editing ? 'editing' : ''}"
               data-action="${editing ? '' : 'open-log'}"
               data-category="basic"
               data-id="${escapeHtml(item.id)}"
               data-reorder-list="basics"
               data-index="${idx}"
               role="button" tabindex="0">
            ${editing ? `<span class="card-grip">⋮⋮</span><button type="button" class="card-del-btn" data-action="delete-menu" data-list="basics" data-id="${escapeHtml(item.id)}" aria-label="削除">×</button>` : ''}
            <div class="card-top-row">
              <div class="card-title">${escapeHtml(item.name)}</div>
              ${done && !editing ? `<span class="done-check">✓</span>` : ''}
            </div>
            <div class="card-meta">
              <span class="bpm-chip">${bpmText}</span>
              <span class="elapsed-chip ${elapsedClass}">${formatElapsedLabel(st.elapsedDays)}</span>
            </div>
          </div>`;
      }).join('');

      return `
        <div class="section-head">
          <div class="section-title">基礎練習メニュー</div>
          <div class="section-actions">
            ${editing
              ? `<button type="button" class="btn-mini gold" data-action="open-add-menu" data-category="basic">＋ 追加</button>
                 <button type="button" class="btn-mini primary" data-action="toggle-edit-mode">編集完了</button>`
              : `<button type="button" class="btn-mini" data-action="toggle-edit-mode">メニュー編集</button>`}
          </div>
        </div>
        ${editing ? `<div class="edit-hint"><span>カードをドラッグまたはフリックで並び替え・右上の×で削除</span></div>` : ''}
        <div class="menu-grid" id="reorderContainer">${cards || `<div class="empty-state" style="grid-column:span 2;">メニューがありません。「メニュー編集」→「＋ 追加」から登録できます。</div>`}</div>`;
    }

    function renderScalesSection() {
      const sort = state.data.ui.scaleSort;
      const filter = state.data.ui.scaleFilter;

      const sortFn = (a, b) => sort === 'chromatic' ? (a.chroma - b.chroma) : (a.fifth - b.fifth);
      const majors = SCALES.filter(s => s.mode === 'major').sort(sortFn);
      const minors = SCALES.filter(s => s.mode === 'minor').sort(sortFn);

      const renderTile = (s) => {
        const st = getItemStats('scale', s.id);
        const done = isDoneOnDate(state.selectedDate, 'scale', s.id);
        const isCompact = s.accType === 'both6';
        const bpmStr = st.lastBpm ? `♩${st.lastBpm}` : '—';
        const elapsedStr = st.elapsedDays === null ? '未' : (st.elapsedDays === 0 ? '今日' : `${st.elapsedDays}日前`);

        return `
          <button type="button" class="scale-tile ${s.mode} ${done ? 'done-today' : ''}" data-action="open-log" data-category="scale" data-id="${s.id}">
            <div class="scale-tile-head">
              <span class="scale-key-name ${isCompact ? 'compact' : ''}">${s.name}</span>
              <span class="scale-acc-badge ${isCompact ? 'compact' : ''}">${s.badge}</span>
            </div>
            <div class="scale-staff-box">${buildKeySignatureSvg(s)}</div>
            <div class="scale-tile-foot">
              <span>${bpmStr}</span>
              <span>${elapsedStr}</span>
            </div>
          </button>`;
      };

      return `
        <div class="scale-toolbar">
          <div class="section-actions">
            <button type="button" class="btn-mini ${sort === 'fifths' ? 'active' : ''}" data-action="set-scale-sort" data-sort="fifths">五度圏順</button>
            <button type="button" class="btn-mini ${sort === 'chromatic' ? 'active' : ''}" data-action="set-scale-sort" data-sort="chromatic">半音階順</button>
          </div>
          <div class="section-actions">
            <button type="button" class="btn-mini ${filter === 'all' ? 'active' : ''}" data-action="set-scale-filter" data-filter="all">全24</button>
            <button type="button" class="btn-mini ${filter === 'major' ? 'gold' : ''}" data-action="set-scale-filter" data-filter="major">長調</button>
            <button type="button" class="btn-mini ${filter === 'minor' ? 'teal' : ''}" data-action="set-scale-filter" data-filter="minor">短調</button>
          </div>
        </div>
        ${filter !== 'minor' ? `
          <div class="scale-group-label major">Major</div>
          <div class="scale-grid">${majors.map(renderTile).join('')}</div>` : ''}
        ${filter !== 'major' ? `
          <div class="scale-group-label minor">minor</div>
          <div class="scale-grid">${minors.map(renderTile).join('')}</div>` : ''}`;
    }

    function renderEtudesSection() {
      // Level 2: Number Grid View for selected numbered etude book
      if (state.activeEtudeBookId) {
        const book = state.data.etudes.find(e => e.id === state.activeEtudeBookId);
        if (book && book.hasNumbers) {
          return renderEtudeNumberGrid(book);
        } else {
          state.activeEtudeBookId = null;
        }
      }

      // Level 1: Etude Books List
      const editing = state.editMode;
      const cards = state.data.etudes.map((book, idx) => {
        const summary = getEtudeBookSummary(book);
        const doneToday = isDoneOnDate(state.selectedDate, 'etude', book.id);

        if (book.hasNumbers) {
          const pct = Math.round((summary.practicedCount / Math.max(1, summary.total)) * 100);
          const lastText = summary.lastLog
            ? `前回 No.${summary.lastLog.etudeNum} (${formatElapsedLabel(summary.elapsedDays)})`
            : 'まだ記録がありません';

          return `
            <div class="menu-card etude-book-card ${doneToday ? 'done-today' : ''} ${editing ? 'editing' : ''}"
                 data-action="${editing ? '' : 'open-etude-book'}"
                 data-id="${escapeHtml(book.id)}"
                 data-reorder-list="etudes"
                 data-index="${idx}"
                 role="button" tabindex="0">
              ${editing ? `<span class="card-grip">⋮⋮</span><button type="button" class="card-del-btn" data-action="delete-menu" data-list="etudes" data-id="${escapeHtml(book.id)}" aria-label="削除">×</button>` : ''}
              <div class="card-top-row">
                <div class="card-title">${escapeHtml(book.name)}</div>
                ${!editing ? `<span class="badge-mini gold">${book.startNum}〜${book.endNum}番 ›</span>` : ''}
              </div>
              <div class="etude-progress-wrap">
                <div class="etude-progress-bar"><div class="etude-progress-fill" style="width:${pct}%"></div></div>
                <div class="etude-badges">
                  <span class="badge-mini">${summary.practicedCount} / ${summary.total} 済</span>
                  ${summary.unreachedCount > 0 ? `<span class="badge-mini warn">目標未達 ${summary.unreachedCount}</span>` : ''}
                  <span class="badge-mini">${lastText}</span>
                </div>
              </div>
            </div>`;
        } else {
          const st = getItemStats('etude', book.id, null);
          const tBpm = state.data.etudeTargets[etudeTargetKey(book.id, null)] || null;
          const isUnreached = tBpm && (st.lastBpm === null || st.lastBpm < tBpm);
          const bpmText = tBpm
            ? `♩=${st.lastBpm ?? '--'} / 目標 ${tBpm}`
            : (st.lastBpm ? `♩=${st.lastBpm}` : `目安 ♩=${book.defaultBpm}`);
          const elapsedClass = st.elapsedDays === 0 ? 'today' : (st.elapsedDays === null || st.elapsedDays >= 3 ? 'warn' : '');

          return `
            <div class="menu-card etude-book-card ${doneToday ? 'done-today' : ''} ${editing ? 'editing' : ''}"
                 data-action="${editing ? '' : 'open-log'}"
                 data-category="etude"
                 data-id="${escapeHtml(book.id)}"
                 data-reorder-list="etudes"
                 data-index="${idx}"
                 role="button" tabindex="0">
              ${editing ? `<span class="card-grip">⋮⋮</span><button type="button" class="card-del-btn" data-action="delete-menu" data-list="etudes" data-id="${escapeHtml(book.id)}" aria-label="削除">×</button>` : ''}
              <div class="card-top-row">
                <div class="card-title">${escapeHtml(book.name)}</div>
                ${doneToday && !editing ? `<span class="done-check">✓</span>` : `<span class="badge-mini">単体</span>`}
              </div>
              <div class="card-meta" style="margin-top:6px;">
                <span class="bpm-chip" style="${isUnreached ? 'color:#fbbf24;' : ''}">${bpmText}</span>
                <span class="elapsed-chip ${elapsedClass}">${formatElapsedLabel(st.elapsedDays)}</span>
              </div>
            </div>`;
        }
      }).join('');

      return `
        <div class="section-head">
          <div class="section-title">エチュード教本</div>
          <div class="section-actions">
            ${editing
              ? `<button type="button" class="btn-mini gold" data-action="open-add-menu" data-category="etude">＋ 追加</button>
                 <button type="button" class="btn-mini primary" data-action="toggle-edit-mode">編集完了</button>`
              : `<button type="button" class="btn-mini" data-action="toggle-edit-mode">メニュー編集</button>`}
          </div>
        </div>
        ${editing ? `<div class="edit-hint"><span>ドラッグ／フリックで順番を変更・右上の×で削除できます</span></div>` : ''}
        <div class="menu-grid" id="reorderContainer">${cards || `<div class="empty-state" style="grid-column:span 2;">エチュードがありません。「メニュー編集」→「＋ 追加」から登録できます。</div>`}</div>`;
    }

    function renderEtudeNumberGrid(book) {
      const summary = getEtudeBookSummary(book);
      const filter = state.data.ui.etudeNumberFilter;

      const items = [];
      for (let n = book.startNum; n <= book.endNum; n++) {
        const st = getItemStats('etude', book.id, n);
        const tBpm = state.data.etudeTargets[etudeTargetKey(book.id, n)] || null;
        const doneToday = isDoneOnDate(state.selectedDate, 'etude', book.id, n);
        const isUnreached = Boolean(tBpm && (st.lastBpm === null || st.lastBpm < tBpm));
        const isReached = Boolean(tBpm && st.lastBpm !== null && st.lastBpm >= tBpm);
        items.push({ num: n, st, tBpm, doneToday, isUnreached, isReached });
      }

      let filtered = items;
      if (filter === 'unreached') {
        filtered = items.filter(it => it.isUnreached);
      } else if (filter === 'review') {
        filtered = items
          .filter(it => it.st.count > 0)
          .sort((a, b) => (b.st.elapsedDays ?? 0) - (a.st.elapsedDays ?? 0));
      } else if (filter === 'untouched') {
        filtered = items.filter(it => it.st.count === 0);
      }

      const tilesHtml = filtered.length === 0
        ? `<div class="empty-state" style="grid-column:1/-1;">該当する曲番号はありません。</div>`
        : filtered.map(it => {
            const cls = [
              'num-tile',
              it.st.count > 0 ? 'practiced' : '',
              it.isUnreached ? 'target-unreached' : '',
              it.isReached ? 'target-reached' : '',
              it.doneToday ? 'done-today' : ''
            ].filter(Boolean).join(' ');

            let bpmLabel = '未';
            if (it.tBpm) {
              bpmLabel = `${it.st.lastBpm ?? '-'}/${it.tBpm}`;
            } else if (it.st.lastBpm) {
              bpmLabel = `♩${it.st.lastBpm}`;
            } else if (it.st.count > 0) {
              bpmLabel = '済';
            }

            const daysLabel = it.st.elapsedDays === null
              ? '—'
              : (it.st.elapsedDays === 0 ? '今日' : `${it.st.elapsedDays}日前`);

            return `
              <button type="button" class="${cls}" data-action="open-log" data-category="etude" data-id="${escapeHtml(book.id)}" data-num="${it.num}">
                ${it.doneToday ? '<span class="num-dot-today"></span>' : ''}
                <span class="num-tile-no">${it.num}</span>
                <span class="num-tile-bpm">${bpmLabel}</span>
                <span class="num-tile-days">${daysLabel}</span>
              </button>`;
          }).join('');

      return `
        <div class="etude-sub-header">
          <div class="etude-sub-top">
            <button type="button" class="back-btn" data-action="close-etude-book">← エチュード一覧</button>
            <div class="etude-badges">
              <span class="badge-mini">${summary.practicedCount}/${summary.total}済</span>
              ${summary.unreachedCount > 0 ? `<span class="badge-mini warn">未達 ${summary.unreachedCount}</span>` : ''}
            </div>
          </div>
          <div class="etude-sub-title">${escapeHtml(book.name)}</div>
          <div class="etude-progress-bar" style="margin-bottom:0;">
            <div class="etude-progress-fill" style="width:${Math.round((summary.practicedCount / Math.max(1, summary.total)) * 100)}%"></div>
          </div>
        </div>

        <div class="filter-row">
          <button type="button" class="filter-pill ${filter === 'all' ? 'active' : ''}" data-action="set-etude-filter" data-filter="all">すべて (${summary.total})</button>
          <button type="button" class="filter-pill ${filter === 'unreached' ? 'active-amber' : ''}" data-action="set-etude-filter" data-filter="unreached">目標未達 (${summary.unreachedCount})</button>
          <button type="button" class="filter-pill ${filter === 'review' ? 'active' : ''}" data-action="set-etude-filter" data-filter="review">周回(久々)</button>
          <button type="button" class="filter-pill ${filter === 'untouched' ? 'active' : ''}" data-action="set-etude-filter" data-filter="untouched">未着手</button>
        </div>

        <div class="etude-num-grid">${tilesHtml}</div>`;
    }

    function renderLogRow(l) {
      const displayName = l.category === 'etude' && l.etudeNum !== null
        ? `${l.itemName} No.${l.etudeNum}`
        : l.itemName;
      const tBpm = l.targetBpm || (l.category === 'etude' ? state.data.etudeTargets[etudeTargetKey(l.itemId, l.etudeNum)] : null);
      const bpmChip = l.bpm
        ? (tBpm ? `♩=${l.bpm} / 目標 ${tBpm}` : `♩=${l.bpm}`)
        : 'テンポなし';
      const durText = formatDurationLabel(getLogSeconds(l));
      const tagsHtml = (l.tags && l.tags.length)
        ? l.tags.map(t => `<span class="badge-mini" style="font-size:10px;">${escapeHtml(t)}</span>`).join('')
        : '';

      return `
        <div class="log-item">
          <div class="log-main">
            <div class="log-title-line">
              <span class="cat-dot ${l.category}"></span>
              <span class="log-name">${escapeHtml(displayName)}</span>
              ${tagsHtml}
            </div>
            <div class="log-meta-line">
              <span style="color:var(--gold-bright);font-weight:700;">${bpmChip}</span>
              <span>${durText}</span>
            </div>
            ${l.memo ? `<div class="log-memo">${escapeHtml(l.memo)}</div>` : ''}
          </div>
          <div class="log-actions">
            <button type="button" class="icon-btn" data-action="edit-log" data-log-id="${escapeHtml(l.id)}" aria-label="編集">✎</button>
            <button type="button" class="icon-btn danger" data-action="delete-log" data-log-id="${escapeHtml(l.id)}" aria-label="削除">🗑</button>
          </div>
        </div>`;
    }

    /* ========================
       Render Analytics View
       ======================== */
    function renderAnalyticsView() {
      const period = state.data.ui.analyticsPeriod;
      const cutoff = addDays(todayStr(), -(period - 1));
      const periodLogs = state.data.logs.filter(l => l.date >= cutoff && l.date <= todayStr());

      const secBasic = periodLogs.filter(l => l.category === 'basic').reduce((s, l) => s + getLogSeconds(l), 0);
      const secScale = periodLogs.filter(l => l.category === 'scale').reduce((s, l) => s + getLogSeconds(l), 0);
      const secEtude = periodLogs.filter(l => l.category === 'etude').reduce((s, l) => s + getLogSeconds(l), 0);
      const totalSec = secBasic + secScale + secEtude;

      const minBasic = secBasic > 0 ? Math.max(1, Math.round(secBasic / 60)) : 0;
      const minScale = secScale > 0 ? Math.max(1, Math.round(secScale / 60)) : 0;
      const minEtude = secEtude > 0 ? Math.max(1, Math.round(secEtude / 60)) : 0;
      const totalMin = totalSec > 0 ? Math.max(1, Math.round(totalSec / 60)) : 0;

      const pctB = totalSec ? Math.round((secBasic / totalSec) * 100) : 0;
      const pctS = totalSec ? Math.round((secScale / totalSec) * 100) : 0;
      const pctE = totalSec ? Math.max(0, 100 - pctB - pctS) : 0;

      // 1. Target-Unreached Etudes Pickup
      const unreachedList = [];
      state.data.etudes.forEach(book => {
        if (book.hasNumbers) {
          for (let n = book.startNum; n <= book.endNum; n++) {
            const tBpm = state.data.etudeTargets[etudeTargetKey(book.id, n)];
            if (!tBpm) continue;
            const st = getItemStats('etude', book.id, n);
            if (st.lastBpm === null || st.lastBpm < tBpm) {
              unreachedList.push({
                bookId: book.id,
                name: `${book.name} No.${n}`,
                num: n,
                lastBpm: st.lastBpm,
                targetBpm: tBpm,
                gap: tBpm - (st.lastBpm || 0),
                elapsedDays: st.elapsedDays
              });
            }
          }
        } else {
          const tBpm = state.data.etudeTargets[etudeTargetKey(book.id, null)];
          if (tBpm) {
            const st = getItemStats('etude', book.id, null);
            if (st.lastBpm === null || st.lastBpm < tBpm) {
              unreachedList.push({
                bookId: book.id,
                name: book.name,
                num: null,
                lastBpm: st.lastBpm,
                targetBpm: tBpm,
                gap: tBpm - (st.lastBpm || 0),
                elapsedDays: st.elapsedDays
              });
            }
          }
        }
      });
      unreachedList.sort((a, b) => (b.elapsedDays ?? 999) - (a.elapsedDays ?? 999));

      // 2. Neglected Ranking
      const neglected = [];
      state.data.basics.forEach(b => {
        const st = getItemStats('basic', b.id);
        if (st.elapsedDays === null || st.elapsedDays >= 3) {
          neglected.push({
            category: 'basic', itemId: b.id, etudeNum: null,
            name: b.name, sub: '基礎練習', elapsedDays: st.elapsedDays,
            score: st.elapsedDays === null ? 9999 : st.elapsedDays
          });
        }
      });

      state.data.etudes.forEach(book => {
        if (book.hasNumbers) {
          const startedNums = [];
          for (let n = book.startNum; n <= book.endNum; n++) {
            const st = getItemStats('etude', book.id, n);
            if (st.count > 0 && st.elapsedDays >= 4) {
              startedNums.push({ n, st });
            }
          }
          startedNums.sort((a, b) => b.st.elapsedDays - a.st.elapsedDays);
          startedNums.slice(0, 3).forEach(({ n, st }) => {
            neglected.push({
              category: 'etude', itemId: book.id, etudeNum: n,
              name: `${book.name} No.${n}`, sub: 'エチュード周回',
              elapsedDays: st.elapsedDays, score: st.elapsedDays
            });
          });
        } else {
          const st = getItemStats('etude', book.id, null);
          if (st.elapsedDays === null || st.elapsedDays >= 3) {
            neglected.push({
              category: 'etude', itemId: book.id, etudeNum: null,
              name: book.name, sub: 'エチュード',
              elapsedDays: st.elapsedDays, score: st.elapsedDays === null ? 9998 : st.elapsedDays
            });
          }
        }
      });
      neglected.sort((a, b) => b.score - a.score);

      // 3. 24-Scale Coverage Map
      const renderCovCells = (mode) => SCALES.filter(s => s.mode === mode).map(s => {
        const st = getItemStats('scale', s.id);
        let lv = '';
        if (st.elapsedDays !== null) {
          if (st.elapsedDays <= 2) lv = 'lv3';
          else if (st.elapsedDays <= 7) lv = 'lv2';
          else lv = 'lv1';
        }
        const sub = st.elapsedDays === null ? '未' : (st.elapsedDays === 0 ? '今日' : `${st.elapsedDays}d`);
        return `
          <button type="button" class="cov-cell ${mode} ${lv}" data-action="open-log" data-category="scale" data-id="${s.id}">
            <span class="cov-key ${s.accType === 'both6' ? 'compact' : ''}">${s.name}</span>
            <span class="cov-sub">${sub}</span>
          </button>`;
      }).join('');

      // 4. BPM Summary
      const bpmRows = [];
      state.data.basics.forEach(b => {
        const st = getItemStats('basic', b.id);
        if (st.lastBpm || st.maxBpm) {
          bpmRows.push({ name: b.name, cat: 'basic', last: st.lastBpm, max: st.maxBpm, target: null, id: b.id, num: null });
        }
      });
      state.data.etudes.forEach(book => {
        if (book.hasNumbers) {
          for (let n = book.startNum; n <= book.endNum; n++) {
            const st = getItemStats('etude', book.id, n);
            if (st.lastBpm || st.maxBpm) {
              bpmRows.push({
                name: `${book.name} No.${n}`, cat: 'etude',
                last: st.lastBpm, max: st.maxBpm,
                target: state.data.etudeTargets[etudeTargetKey(book.id, n)] || null,
                id: book.id, num: n
              });
            }
          }
        } else {
          const st = getItemStats('etude', book.id, null);
          if (st.lastBpm || st.maxBpm) {
            bpmRows.push({
              name: book.name, cat: 'etude', last: st.lastBpm, max: st.maxBpm,
              target: state.data.etudeTargets[etudeTargetKey(book.id, null)] || null,
              id: book.id, num: null
            });
          }
        }
      });

      return `
        <div class="card-panel">
          <div class="panel-title">
            <span>三本柱の練習時間バランス</span>
            <div class="section-actions">
              <button type="button" class="btn-mini ${period === 7 ? 'active' : ''}" data-action="set-analytics-period" data-period="7">7日</button>
              <button type="button" class="btn-mini ${period === 30 ? 'active' : ''}" data-action="set-analytics-period" data-period="30">30日</button>
            </div>
          </div>
          <div style="font-size:13px;color:var(--text-sub);">
            合計 <strong style="color:var(--gold-bright);font-size:18px;">${totalMin}</strong> 分（${periodLogs.length}件）
          </div>
          <div class="stacked-bar">
            <div class="bar-seg basic" style="width:${pctB}%"></div>
            <div class="bar-seg scale" style="width:${pctS}%"></div>
            <div class="bar-seg etude" style="width:${pctE}%"></div>
          </div>
          <div class="legend-grid">
            <div class="legend-box">
              <div class="legend-label">基礎練習</div>
              <div class="legend-val" style="color:var(--gold-bright);">${minBasic}分</div>
              <div class="legend-pct">${pctB}%</div>
            </div>
            <div class="legend-box">
              <div class="legend-label">スケール</div>
              <div class="legend-val" style="color:var(--teal-bright);">${minScale}分</div>
              <div class="legend-pct">${pctS}%</div>
            </div>
            <div class="legend-box">
              <div class="legend-label">エチュード</div>
              <div class="legend-val" style="color:#fbbf24;">${minEtude}分</div>
              <div class="legend-pct">${pctE}%</div>
            </div>
          </div>
        </div>

        <div class="card-panel">
          <div class="panel-title">
            <span>🎯 インテンポ未達エチュード</span>
            <span class="badge-mini ${unreachedList.length ? 'warn' : 'green'}">${unreachedList.length}曲</span>
          </div>
          ${unreachedList.length === 0
            ? `<div class="empty-state" style="padding:12px;">目標テンポ未達の曲はありません。エチュード記録時に目標BPMを入れるとここに自動表示されます。</div>`
            : `<div class="rank-list">
                ${unreachedList.slice(0, 8).map(it => `
                  <button type="button" class="rank-row" data-action="open-log" data-category="etude" data-id="${escapeHtml(it.bookId)}" data-num="${it.num ?? ''}">
                    <div class="rank-left">
                      <span class="rank-name">${escapeHtml(it.name)}</span>
                      <span class="rank-sub">前回 ${it.lastBpm ? `♩=${it.lastBpm}` : '未記録'} → 目標 ♩=${it.targetBpm}（あと +${it.gap}）</span>
                    </div>
                    <span class="badge-mini warn">${formatElapsedLabel(it.elapsedDays)}</span>
                  </button>`).join('')}
               </div>`}
        </div>

        <div class="card-panel">
          <div class="panel-title">
            <span>⚠️ サボりがち・周回ピックアップ</span>
            <span class="badge-mini">タップで記録</span>
          </div>
          ${neglected.length === 0
            ? `<div class="empty-state" style="padding:12px;">直近で偏りなく練習できています！</div>`
            : `<div class="rank-list">
                ${neglected.slice(0, 8).map(it => `
                  <button type="button" class="rank-row" data-action="open-log" data-category="${it.category}" data-id="${escapeHtml(it.itemId)}" data-num="${it.etudeNum ?? ''}">
                    <div class="rank-left">
                      <span class="rank-name"><span class="cat-dot ${it.category}"></span>${escapeHtml(it.name)}</span>
                      <span class="rank-sub">${it.sub}</span>
                    </div>
                    <span class="badge-mini warn">${it.elapsedDays === null ? '未実施' : `${it.elapsedDays}日ぶり`}</span>
                  </button>`).join('')}
               </div>`}
        </div>

        <div class="card-panel">
          <div class="panel-title">

    /* ========================
       Render History (Calendar)
       ======================== */
    function renderHistoryView() {
      const { year, month } = state.calendarMonth;
      const firstDay = new Date(year, month, 1);
      const lastDay = new Date(year, month + 1, 0);
      const startDow = firstDay.getDay();
      const daysInMonth = lastDay.getDate();

      const prefix = `${year}-${String(month + 1).padStart(2, '0')}-`;
      const daySecs = {};
      state.data.logs.forEach(l => {
        if (l.date.startsWith(prefix)) {
          daySecs[l.date] = (daySecs[l.date] || 0) + getLogSeconds(l);
        }
      });

      const cells = [];
      for (let i = 0; i < startDow; i++) {
        cells.push(`<div class="cal-cell empty"></div>`);
      }
      const today = todayStr();
      for (let d = 1; d <= daysInMonth; d++) {
        const ds = `${prefix}${String(d).padStart(2, '0')}`;
        const sec = daySecs[ds] || 0;
        const m = sec > 0 ? Math.max(1, Math.round(sec / 60)) : 0;
        let hm = '';
        if (m >= 90) hm = 'hm4';
        else if (m >= 50) hm = 'hm3';
        else if (m >= 25) hm = 'hm2';
        else if (m > 0) hm = 'hm1';

        const isToday = ds === today;
        const isSel = ds === state.calendarSelectedDate;
        cells.push(`
          <button type="button" class="cal-cell ${hm} ${isToday ? 'is-today' : ''} ${isSel ? 'selected' : ''}" data-action="select-cal-date" data-date="${ds}">
            <span>${d}</span>
            ${m > 0 ? `<span class="cal-min">${m}m</span>` : ''}
          </button>`);
      }

      const selLogs = getLogsForDate(state.calendarSelectedDate);
      const selTotalMin = sumSecondsToMinutes(selLogs);

      return `
        <div class="card-panel">
          <div class="cal-head">
            <button type="button" class="btn-mini" data-action="shift-cal-month" data-delta="-1">◀ 前月</button>
            <strong style="font-size:15px;">${year}年 ${month + 1}月</strong>
            <button type="button" class="btn-mini" data-action="shift-cal-month" data-delta="1">翌月 ▶</button>
          </div>
          <div class="cal-weekdays">${WEEKDAYS.map(w => `<span>${w}</span>`).join('')}</div>
          <div class="cal-grid">${cells.join('')}</div>
        </div>

        <div class="log-list-card">
          <div class="section-head">
            <div class="section-title">${formatDisplayDate(state.calendarSelectedDate)}（${selTotalMin}分）</div>
            <button type="button" class="btn-mini gold" data-action="jump-to-date" data-date="${state.calendarSelectedDate}">＋ この日に記録</button>
          </div>
          ${selLogs.length === 0
            ? `<div class="empty-state">この日の記録はありません。</div>`
            : selLogs.map(renderLogRow).join('')}
        </div>`;
    }

    /* ========================
       Logging Bottom Sheet
       ======================== */
    function openLogSheet(opts) {
      const editingLog = opts.editLogId
        ? state.data.logs.find(l => l.id === opts.editLogId)
        : null;

      // Initialize timer & stop any active metronome
      stopMetronome();
      resetTimerState(editingLog ? getLogSeconds(editingLog) : 0);

      const category = editingLog ? editingLog.category : opts.category;
      const itemId = editingLog ? editingLog.itemId : opts.itemId;
      const etudeNum = editingLog
        ? editingLog.etudeNum
        : (opts.etudeNum !== undefined && opts.etudeNum !== null && opts.etudeNum !== '' ? Number(opts.etudeNum) : null);
      const date = editingLog ? editingLog.date : (opts.date || state.selectedDate);

      let itemName = '';
      let defaultBpm = 80;
      let etudeBook = null;

      if (category === 'basic') {
        const b = state.data.basics.find(x => x.id === itemId);
        itemName = b ? b.name : (editingLog ? editingLog.itemName : '基礎練習');
        defaultBpm = b ? b.defaultBpm : 80;
      } else if (category === 'scale') {
        const s = SCALE_MAP[itemId];
        itemName = s ? s.name : (editingLog ? editingLog.itemName : 'スケール');
        defaultBpm = 88;
      } else if (category === 'etude') {
        etudeBook = state.data.etudes.find(x => x.id === itemId);
        itemName = etudeBook ? etudeBook.name : (editingLog ? editingLog.itemName : 'エチュード');
        defaultBpm = etudeBook ? etudeBook.defaultBpm : 100;
      }

      const prevStats = getItemStats(category, itemId, etudeNum);
      const savedTarget = category === 'etude'
        ? (state.data.etudeTargets[etudeTargetKey(itemId, etudeNum)] || null)
        : null;

      let bpmVal, noTempo, targetBpmVal, tagsVal, memoVal;

      if (editingLog) {
        bpmVal = editingLog.bpm;
        noTempo = editingLog.bpm === null;
        targetBpmVal = editingLog.targetBpm !== null ? editingLog.targetBpm : savedTarget;
        tagsVal = Array.isArray(editingLog.tags) ? [...editingLog.tags] : [];
        memoVal = editingLog.memo || '';
      } else {
        bpmVal = prevStats.lastBpm !== null ? prevStats.lastBpm : defaultBpm;
        noTempo = bpmVal === null;
        targetBpmVal = savedTarget;
        tagsVal = [];
        memoVal = '';
      }

      state.logDraft = {
        editLogId: editingLog ? editingLog.id : null,
        date,
        category,
        itemId,
        itemName,
        etudeNum,
        etudeBook,
        bpm: bpmVal !== null ? bpmVal : 80,
        noTempo,
        targetBpm: targetBpmVal,
        tags: tagsVal,
        memo: memoVal
      };

      renderLogSheet();
      openModal('logModal');
    }

        ${scaleObj ? `

        <!-- BPM -->

            <button type="button" class="step-btn" data-action="step-bpm" data-delta="1" ${d.noTempo ? 'disabled' : ''}>+1</button>

          ${!d.noTempo ? `

    function updateTargetHintDom() {
      const wrap = document.getElementById('sheetTargetHintWrap');
      const d = state.logDraft;
      if (!wrap || !d || d.category !== 'etude') return;
      if (d.targetBpm && !d.noTempo) {
        const diff = d.targetBpm - d.bpm;
        wrap.innerHTML = diff > 0
          ? `<div class="target-status-hint unreached">目標インテンポ（♩=${d.targetBpm}）まであと +${diff} BPM（目標未達リストに表示されます）</div>`
          : `<div class="target-status-hint reached">✓ 目標インテンポ（♩=${d.targetBpm}）達成！</div>`;
      } else {
        wrap.innerHTML = '';
      }
    }

    function saveLogDraft() {
      const d = state.logDraft;
      if (!d) return;

      // Commit any active 4-digit direct input
      commitTimerDirectInput();

      // Auto-stop running timer and get exact elapsed seconds
      const elapsedMs = getTimerElapsedMs();
      if (state.timer.running) {
        stopTimerInterval();
        state.timer.running = false;
        state.timer.accumulatedMs = elapsedMs;
      }
      const durationSec = Math.floor(elapsedMs / 1000);
      const durationMin = durationSec > 0 ? Math.max(1, Math.round(durationSec / 60)) : 0;

      const bpmEl = document.getElementById('sheetBpmInput');
      const targetEl = document.getElementById('sheetTargetBpmInput');
      const memoEl = document.getElementById('sheetMemoInput');

      const finalBpm = d.noTempo ? null : Math.max(20, Math.min(300, parseInt(bpmEl ? bpmEl.value : d.bpm, 10) || 80));
      let finalTarget = null;
      if (d.category === 'etude' && targetEl) {
        const rawT = targetEl.value.trim();
        if (rawT !== '') {
          const parsedT = parseInt(rawT, 10);
          if (!isNaN(parsedT) && parsedT >= 20 && parsedT <= 300) {
            finalTarget = parsedT;
          }
        }
        const key = etudeTargetKey(d.itemId, d.etudeNum);
        if (finalTarget !== null) {
          state.data.etudeTargets[key] = finalTarget;
        } else {
          delete state.data.etudeTargets[key];
        }
      }

      const finalMemo = memoEl ? memoEl.value.trim() : d.memo;

      if (d.editLogId) {
        const idx = state.data.logs.findIndex(l => l.id === d.editLogId);
        if (idx !== -1) {
          state.data.logs[idx] = {
            ...state.data.logs[idx],
            bpm: finalBpm,
            targetBpm: finalTarget,
            durationSec,
            duration: durationMin,
            tags: [...d.tags],
            memo: finalMemo
          };
        }
        showToast('記録を更新しました');
      } else {
        state.data.logs.push({
          id: uid('log'),
          date: d.date,
          category: d.category,
          itemId: d.itemId,
          itemName: d.itemName,
          etudeNum: d.etudeNum,
          bpm: finalBpm,
          targetBpm: finalTarget,
          durationSec,
          duration: durationMin,
          tags: [...d.tags],
          memo: finalMemo,
          createdAt: Date.now()
        });
        const label = d.etudeNum !== null ? `${d.itemName} No.${d.etudeNum}` : d.itemName;
        showToast(`${label}（${formatDurationLabel(durationSec)}）を記録しました`);
      }

      saveData();
      closeModal('logModal');
      render();
    }

    function submitAddMenu() {
      const category = document.getElementById('addMenuCategory').value;
      const name = (document.getElementById('addMenuName').value || '').trim();
      if (!name) {
        showToast('名前を入力してください');
        return;
      }

      const rawBpm = (document.getElementById('addMenuBpm').value || '').trim();
      const defaultBpm = rawBpm === '' ? null : Math.max(20, Math.min(300, parseInt(rawBpm, 10) || 80));

      if (category === 'basic') {
        state.data.basics.push({ id: uid('b'), name, defaultBpm, defaultDuration: 10 });
      } else {
        const hasNumbers = Boolean(document.getElementById('addEtudeHasNumbers').checked);
        let startNum = Math.max(1, parseInt(document.getElementById('addEtudeStartNum').value, 10) || 1);
        let endNum = Math.max(startNum, parseInt(document.getElementById('addEtudeEndNum').value, 10) || startNum);
        if (endNum - startNum > 299) endNum = startNum + 299;
        state.data.etudes.push({
          id: uid('e'),
          name,
          hasNumbers,
          startNum: hasNumbers ? startNum : 1,
          endNum: hasNumbers ? endNum : 1,
          defaultBpm: defaultBpm || 100,
          defaultDuration: 15
        });
      }

      saveData();
      closeModal('addMenuModal');
      showToast(`「${name}」を追加しました`);
      render();
    }

    /* ========================
       Menu Delete + Undo & Drag/Flick Reorder
       ======================== */
    function deleteMenuItem(listName, id) {
      const list = state.data[listName];
      if (!Array.isArray(list)) return;
      const idx = list.findIndex(x => x.id === id);
      if (idx === -1) return;
      const [removed] = list.splice(idx, 1);
      state.lastDeletedMenu = { listName, item: removed, index: idx };
      saveData();
      render();
      showToast(`「${removed.name}」を削除しました`, true);
    }

    function undoDeleteMenu() {
      if (!state.lastDeletedMenu) return;
      const { listName, item, index } = state.lastDeletedMenu;
      const list = state.data[listName];
      if (Array.isArray(list)) {
        const safeIdx = Math.min(index, list.length);
        list.splice(safeIdx, 0, item);
        saveData();
      }
      state.lastDeletedMenu = null;
      document.getElementById('toastContainer').innerHTML = '';
      render();
      showToast(`「${item.name}」を元に戻しました`);
    }

    function setupPointerReorder() {
      const main = document.getElementById('mainView');

      main.addEventListener('pointerdown', (e) => {
        if (!state.editMode) return;
        if (e.target.closest('[data-action="delete-menu"]')) return;
        const card = e.target.closest('.menu-card.editing');
        if (!card) return;

        const listName = card.dataset.reorderList;
        const index = Number(card.dataset.index);
        if (!listName || isNaN(index)) return;

        card.classList.add('dragging');
        state.drag = {
          pointerId: e.pointerId,
          listName,
          fromIndex: index,
          overIndex: index,
          startX: e.clientX,
          startY: e.clientY,
          lastX: e.clientX,
          lastY: e.clientY,
          moved: false,
          sourceCard: card
        };
        try { card.setPointerCapture(e.pointerId); } catch (_) {}
      });

      main.addEventListener('pointermove', (e) => {
        if (!state.drag || e.pointerId !== state.drag.pointerId) return;
        const d = state.drag;
        d.lastX = e.clientX;
        d.lastY = e.clientY;
        const dist = Math.hypot(d.lastX - d.startX, d.lastY - d.startY);
        if (dist > 8) d.moved = true;

        document.querySelectorAll('.menu-card.drag-over').forEach(el => el.classList.remove('drag-over'));

        d.sourceCard.style.pointerEvents = 'none';
        const hit = document.elementFromPoint(e.clientX, e.clientY);
        d.sourceCard.style.pointerEvents = '';
        const targetCard = hit ? hit.closest('.menu-card.editing') : null;

        if (targetCard && targetCard.dataset.reorderList === d.listName) {
          const targetIdx = Number(targetCard.dataset.index);
          if (!isNaN(targetIdx) && targetIdx !== d.fromIndex) {
            d.overIndex = targetIdx;
            targetCard.classList.add('drag-over');
          } else {
            d.overIndex = d.fromIndex;
          }
        } else {
          d.overIndex = d.fromIndex;
        }
      });

      function finishDrag(e) {
        if (!state.drag || (e.pointerId !== undefined && e.pointerId !== state.drag.pointerId)) return;
        const d = state.drag;
        state.drag = null;

        if (d.sourceCard) {
          d.sourceCard.classList.remove('dragging');
          try { d.sourceCard.releasePointerCapture(d.pointerId); } catch (_) {}
        }
        document.querySelectorAll('.menu-card.drag-over').forEach(el => el.classList.remove('drag-over'));

        const list = state.data[d.listName];
        if (!Array.isArray(list) || list.length < 2) return;

        let targetIndex = d.overIndex;

        if (targetIndex === d.fromIndex && d.moved) {
          const dx = d.lastX - d.startX;
          const dy = d.lastY - d.startY;
          const absX = Math.abs(dx);
          const absY = Math.abs(dy);
          const stepCols = d.listName === 'basics' ? 2 : 1;

          if (Math.max(absX, absY) >= 30) {
            if (absX >= absY) {
              targetIndex = dx > 0 ? Math.min(list.length - 1, d.fromIndex + 1) : Math.max(0, d.fromIndex - 1);
            } else {
              targetIndex = dy > 0 ? Math.min(list.length - 1, d.fromIndex + stepCols) : Math.max(0, d.fromIndex - stepCols);
            }
          }
        }

        if (targetIndex !== d.fromIndex && targetIndex >= 0 && targetIndex < list.length) {
          const [movedItem] = list.splice(d.fromIndex, 1);
          list.splice(targetIndex, 0, movedItem);
          saveData();
          render();
        }
      }

      main.addEventListener('pointerup', finishDrag);
      main.addEventListener('pointercancel', finishDrag);
    }

    function exportJsonFile() {
      const jsonStr = JSON.stringify(state.data, null, 2);
      const blob = new Blob([jsonStr], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `saxlog-backup-${todayStr()}.json`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(url), 1000);
      showToast('JSONバックアップを保存しました');
    }

    function copyJsonToClipboard() {
      const jsonStr = JSON.stringify(state.data, null, 2);
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(jsonStr).then(() => {
          showToast('JSONデータをクリップボードにコピーしました');
        }).catch(() => {
          showToast('コピーに失敗しました。ファイル保存をお試しください');
        });
      } else {
        showToast('この環境ではコピー非対応です。ファイル保存をお試しください');
      }
    }

    function importJsonString(text) {
      try {
        const parsed = JSON.parse(text);
        if (!parsed || typeof parsed !== 'object' || !Array.isArray(parsed.logs)) {
          showToast('SaxLogのデータ形式ではありません');
          return false;
        }
        state.data = sanitizeData(parsed);
        state.activeEtudeBookId = null;
        saveData();
        render();
        showToast(`データを復元しました（${state.data.logs.length}件の記録）`);
        return true;
      } catch (e) {
        showToast('JSONの読み込みに失敗しました');
        return false;
      }
    }

    /* ========================
       Central Event Delegation
       ======================== */
    document.addEventListener('click', (e) => {
      const target = e.target.closest('[data-action]');
      if (!target) return;

      const action = target.dataset.action;

      if (action === 'backdrop-close') {
        if (e.target === target) {
          closeModal(target.dataset.modal);
        }
        return;
      }

      switch (action) {
        case 'switch-tab': {
          state.activeTab = target.dataset.tab;
          state.editMode = false;
          render();
          break;
        }
        case 'switch-pillar': {
          state.activePillar = target.dataset.pillar;
          state.editMode = false;
          if (state.activePillar !== 'etude') state.activeEtudeBookId = null;
          render();
          break;
        }
        case 'shift-date': {
          state.selectedDate = addDays(state.selectedDate, Number(target.dataset.delta) || 0);
          render();
          break;
        }
        case 'go-today': {
          state.selectedDate = todayStr();
          render();
          break;
        }
        case 'toggle-edit-mode': {
          state.editMode = !state.editMode;
          render();
          break;
        }
        case 'open-add-menu': {
          openAddMenuSheet(target.dataset.category);
          break;
        }
        case 'submit-add-menu': {
          submitAddMenu();
          break;
        }
        case 'delete-menu': {
          e.stopPropagation();
          deleteMenuItem(target.dataset.list, target.dataset.id);
          break;
        }
        case 'undo-delete-menu': {
          undoDeleteMenu();
          break;
        }
        case 'set-scale-sort': {
          state.data.ui.scaleSort = target.dataset.sort;
          saveData();
          render();
          break;
        }
        case 'set-scale-filter': {
          state.data.ui.scaleFilter = target.dataset.filter;
          saveData();
          render();
          break;
        }
        case 'open-etude-book': {
          state.activeEtudeBookId = target.dataset.id;
          state.editMode = false;
          render();
          break;
        }
        case 'close-etude-book': {
          state.activeEtudeBookId = null;
          render();
          break;
        }
        case 'set-etude-filter': {
          state.data.ui.etudeNumberFilter = target.dataset.filter;
          saveData();
          render();
          break;
        }
        case 'open-log': {
          const cat = target.dataset.category;
          const id = target.dataset.id;
          const num = target.dataset.num !== undefined && target.dataset.num !== '' ? Number(target.dataset.num) : null;
          openLogSheet({ category: cat, itemId: id, etudeNum: num });
          break;
        }
        case 'open-day-logs': {
          openDayLogsSheet();
          break;
        }
        case 'edit-log': {
          closeModal('dayLogsModal');
          openLogSheet({ editLogId: target.dataset.logId });
          break;
        }
        case 'metro-toggle': {
          toggleMetronome();
          break;
        }
        case 'metro-cycle-beats': {
          cycleMetroBeats();
          break;
        }
        case 'metro-cycle-subdiv': {
          cycleMetroSubdiv();
          break;
        }
        case 'delete-log': {
          const logId = target.dataset.logId;
          openConfirm('記録を削除', 'この練習記録を削除しますか？', '削除する', () => {
            state.data.logs = state.data.logs.filter(l => l.id !== logId);
            saveData();
            render();
            showToast('記録を削除しました');
          });
          break;
        }
        case 'step-etude-num': {
          if (!state.logDraft || !state.logDraft.etudeBook) return;
          const nextNum = state.logDraft.etudeNum + (Number(target.dataset.delta) || 0);
          const b = state.logDraft.etudeBook;
          if (nextNum >= b.startNum && nextNum <= b.endNum) {
            openLogSheet({ category: 'etude', itemId: b.id, etudeNum: nextNum, date: state.logDraft.date });
          }
          break;
        }
        case 'step-bpm': {
          if (!state.logDraft || state.logDraft.noTempo) return;
          const delta = Number(target.dataset.delta) || 0;
          const inp = document.getElementById('sheetBpmInput');
          const cur = parseInt(inp ? inp.value : state.logDraft.bpm, 10) || 80;
          const next = Math.max(20, Math.min(300, cur + delta));
          state.logDraft.bpm = next;
          if (inp) inp.value = next;
          updateTargetHintDom();
          break;
        }
        case 'step-target-bpm': {
          if (!state.logDraft) return;
          const delta = Number(target.dataset.delta) || 0;
          const inp = document.getElementById('sheetTargetBpmInput');
          const curVal = inp && inp.value.trim() !== '' ? parseInt(inp.value, 10) : (state.logDraft.bpm || 100);
          const next = Math.max(20, Math.min(300, curVal + delta));
          state.logDraft.targetBpm = next;
          if (inp) inp.value = next;
          updateTargetHintDom();
          break;
        }
        case 'clear-target-bpm': {
          if (!state.logDraft) return;
          state.logDraft.targetBpm = null;
          renderLogSheet();
          break;
        }
        case 'timer-toggle': {
          toggleTimerStartStop();
          break;
        }
        case 'timer-reset': {
          resetTimerDisplay();
          break;
        }
        case 'toggle-scale-tag': {
          if (!state.logDraft) return;
          const tag = target.dataset.tag;
          const idx = state.logDraft.tags.indexOf(tag);
          if (idx === -1) state.logDraft.tags.push(tag);
          else state.logDraft.tags.splice(idx, 1);
          target.classList.toggle('tag-active', idx === -1);
          break;
        }
        case 'save-log': {
          saveLogDraft();
          break;
        }
        case 'close-modal': {
          closeModal(target.dataset.modal);
          break;
        }
        case 'set-analytics-period': {
          state.data.ui.analyticsPeriod = Number(target.dataset.period) === 30 ? 30 : 7;
          saveData();
          render();
          break;
        }
        case 'shift-cal-month': {
          const delta = Number(target.dataset.delta) || 0;
          const dt = new Date(state.calendarMonth.year, state.calendarMonth.month + delta, 1);
          state.calendarMonth = { year: dt.getFullYear(), month: dt.getMonth() };
          render();
          break;
        }
        case 'select-cal-date': {
          state.calendarSelectedDate = target.dataset.date;
          render();
          break;
        }
        case 'jump-to-date': {
          state.selectedDate = target.dataset.date;
          state.activeTab = 'record';
          render();
          break;
        }
        case 'load-sample': {
          openConfirm(
            'サンプルデータを読込',
            '現在のデータをサンプルデータ（過去14日分・フェルリング／ラクール目標BPM入り）に置き換えますか？',
            '読み込む',
            loadSampleData
          );
          break;
        }
        case 'export-json': {
          exportJsonFile();
          break;
        }
        case 'copy-json': {
          copyJsonToClipboard();
          break;
        }
        case 'trigger-import-file': {
          const fileInput = document.getElementById('jsonFileInput');
          fileInput.value = '';
          fileInput.click();
          break;
        }
        case 'open-paste-import': {
          document.getElementById('importJsonTextarea').value = '';
          openModal('importPasteModal');
          break;
        }
        case 'confirm-paste-import': {
          const txt = document.getElementById('importJsonTextarea').value.trim();
          if (importJsonString(txt)) {
            closeModal('importPasteModal');
          }
          break;
        }
        case 'reset-all': {
          openConfirm(
            '全データをリセット',
            'すべての練習履歴・カスタムメニュー・目標テンポを削除して初期状態に戻します。よろしいですか？',
            'リセットする',
            () => {
              state.data = getDefaultData();
              state.activeEtudeBookId = null;
              saveData();
              render();
              showToast('データを初期化しました');
            }
          );
          break;
        }
        case 'confirm-ok': {
          const cb = state.confirmCallback;
          state.confirmCallback = null;
          closeModal('confirmModal');
          if (typeof cb === 'function') cb();
          break;
        }
      }
    });

    // Focus / Blur / Keydown for 4-digit MMSS Timer Direct Input
    document.addEventListener('focusin', (e) => {
      const target = e.target;
      if (target && target.id === 'sheetTimerDirectInput') {
        if (state.timer.running) {
          state.timer.accumulatedMs = getTimerElapsedMs();
          state.timer.running = false;
          stopTimerInterval();
        }
        state.timer.editing = true;
        state.timer.editDigits = '';
        target.value = '';
        updateTimerDom();
      }
    });

    document.addEventListener('focusout', (e) => {
      const target = e.target;
      if (target && target.id === 'sheetTimerDirectInput') {
        commitTimerDirectInput();
      }
    });

    document.addEventListener('keydown', (e) => {
      const target = e.target;
      if (target && target.id === 'sheetTimerDirectInput' && e.key === 'Enter') {
        e.preventDefault();
        target.blur();
      }
    });

    // Change & Input events inside modals
    document.addEventListener('change', (e) => {
      const target = e.target;
      if (target.id === 'sheetNoTempoCheck' && state.logDraft) {
        state.logDraft.noTempo = target.checked;
        if (target.checked) stopMetronome();
        renderLogSheet();
      } else if (target.id === 'addEtudeHasNumbers') {
        const rangeBox = document.getElementById('addEtudeNumRange');
        if (rangeBox) rangeBox.classList.toggle('hidden', !target.checked);
      } else if (target.id === 'jsonFileInput') {
        const file = target.files && target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = () => importJsonString(String(reader.result || ''));
        reader.readAsText(file);
      }
    });

    document.addEventListener('input', (e) => {
      const target = e.target;
      if (target.id === 'sheetTimerDirectInput') {
        const digits = target.value.replace(/\D/g, '').slice(-4);
        target.value = digits;
        state.timer.editDigits = digits;
        updateTimerDom();
        return;
      }
      if (!state.logDraft) return;
      if (target.id === 'sheetBpmInput') {
        const v = parseInt(target.value, 10);
        if (!isNaN(v)) state.logDraft.bpm = v;
        updateTargetHintDom();
      } else if (target.id === 'sheetTargetBpmInput') {
        const raw = target.value.trim();
        state.logDraft.targetBpm = raw === '' ? null : (parseInt(raw, 10) || null);
        updateTargetHintDom();
      } else if (target.id === 'sheetMemoInput') {
        state.logDraft.memo = target.value;
      }
    });

    /* ========================
       PWA Service Worker Registration
       ======================== */
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      });
    }

    /* ========================
       Boot
       ======================== */
    setupPointerReorder();
    render();
  })();
  </script>
</body>
</html>
