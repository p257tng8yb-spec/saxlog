<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>SaxLog - サックス練習ログ</title>
  <meta name="description" content="サックスの基礎練習・24調スケール・エチュード番号別目標BPMを毎日記録できる練習ログアプリ" />
  <meta name="theme-color" content="#0f1115" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="SaxLog" />
  <link rel="apple-touch-icon" href="./icon.png" />
  <link rel="icon" type="image/png" href="./icon-192.png" />
  <link rel="manifest" href="./manifest.json" />
  <style>
    :root {
      --bg: #0f1115;
      --bg-elevated: #171a21;
      --bg-card: #1d212b;
      --bg-card-hover: #242936;
      --bg-input: #13161d;
      --border: #2b3140;
      --border-soft: rgba(255,255,255,0.07);
      --text: #f2f4f8;
      --text-sub: #a3acb9;
      --text-muted: #6e7787;

      --gold: #d4af37;
      --gold-bright: #e8c75e;
      --gold-dim: rgba(212, 175, 55, 0.16);
      --gold-border: rgba(212, 175, 55, 0.48);

      --teal: #4db6ac;
      --teal-bright: #70d4ca;
      --teal-dim: rgba(77, 182, 172, 0.15);
      --teal-border: rgba(77, 182, 172, 0.45);

      --amber: #f59e0b;
      --amber-dim: rgba(245, 158, 11, 0.16);
      --amber-border: rgba(245, 158, 11, 0.55);

      --green: #34d399;
      --green-dim: rgba(52, 211, 153, 0.15);

      --danger: #ef4444;
      --danger-dim: rgba(239, 68, 68, 0.16);

      --radius: 14px;
      --radius-sm: 10px;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --nav-height: 64px;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic UI", "Noto Sans JP", sans-serif;
      font-size: 15px;
      line-height: 1.45;
      min-height: 100%;
      overscroll-behavior-y: none;
    }

    button, input, textarea, select {
      font-family: inherit;
      color: inherit;
    }

    button {
      cursor: pointer;
      border: none;
      background: none;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    button:active {
      transform: scale(0.97);
    }

    .app-shell {
      max-width: 560px;
      margin: 0 auto;
      min-height: 100vh;
      padding-top: var(--safe-top);
      padding-bottom: calc(var(--nav-height) + var(--safe-bottom) + 24px);
    }

    /* Header */
    .top-header {
      position: sticky;
      top: 0;
      z-index: 30;
      background: rgba(15, 17, 21, 0.92);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border-soft);
      padding: 12px 16px 10px;
    }

    .header-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 800;
      font-size: 18px;
      letter-spacing: 0.02em;
      color: var(--gold-bright);
    }

    .brand-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--gold);
      box-shadow: 0 0 10px rgba(212, 175, 55, 0.7);
    }

    .date-nav {
      display: flex;
      align-items: center;
      gap: 4px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 3px 6px;
    }

    .date-nav-btn {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: var(--text-sub);
      font-size: 14px;
    }
    .date-nav-btn:hover { background: var(--bg-card-hover); color: var(--text); }

    .date-label-btn {
      font-size: 13px;
      font-weight: 700;
      padding: 4px 6px;
      color: var(--text);
      white-space: nowrap;
    }

    .today-pill {
      font-size: 11px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 999px;
      background: var(--gold-dim);
      color: var(--gold-bright);
      border: 1px solid var(--gold-border);
      margin-left: 2px;
    }

    /* Main Content */
    .main-view {
      padding: 14px 14px 10px;
    }

    /* Daily Summary Strip (Tappable to open Day Logs) */
    .summary-strip {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: linear-gradient(135deg, #1d212b 0%, #171a22 100%);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 12px 14px;
      margin-bottom: 12px;
      gap: 10px;
      text-align: left;
      transition: border-color 0.15s, background 0.15s;
    }
    .summary-strip:hover {
      border-color: var(--gold-border);
      background: linear-gradient(135deg, #232836 0%, #191d26 100%);
    }

    .summary-total {
      display: flex;
      flex-direction: column;
    }
    .summary-total-label {
      font-size: 11px;
      color: var(--text-sub);
      display: inline-flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }
    .summary-tap-hint {
      font-size: 10.5px;
      font-weight: 700;
      color: var(--gold-bright);
      background: var(--gold-dim);
      border: 1px solid rgba(212, 175, 55, 0.32);
      border-radius: 999px;
      padding: 1px 7px;
      line-height: 1.4;
    }
    .summary-total-val {
      font-size: 22px;
      font-weight: 800;
      color: var(--gold-bright);
      line-height: 1.2;
    }
    .summary-total-val small {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-sub);
      margin-left: 2px;
    }

    .summary-badges {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .pill-stat {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 11px;
      font-weight: 700;
      padding: 4px 8px;
      border-radius: 999px;
      background: var(--bg-input);
      border: 1px solid var(--border);
      color: var(--text-sub);
    }
    .pill-stat.active-basic { border-color: var(--gold-border); color: var(--gold-bright); background: var(--gold-dim); }
    .pill-stat.active-scale { border-color: var(--teal-border); color: var(--teal-bright); background: var(--teal-dim); }
    .pill-stat.active-etude { border-color: var(--amber-border); color: #fbbf24; background: var(--amber-dim); }

    /* Pillar Segment Control */
    .segment-bar {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      background: var(--bg-elevated);
      padding: 4px;
      border-radius: 12px;
      border: 1px solid var(--border);
      margin-bottom: 14px;
    }

    .segment-btn {
      min-height: 40px;
      border-radius: 9px;
      font-size: 13px;
      font-weight: 700;
      color: var(--text-sub);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      transition: background 0.15s, color 0.15s;
    }
    .segment-btn.active {
      background: var(--gold);
      color: #111318;
      box-shadow: 0 2px 8px rgba(212, 175, 55, 0.3);
    }

    /* Section Header */
    .section-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 10px;
      min-height: 36px;
    }

    .section-title {
      font-size: 14px;
      font-weight: 700;
      color: var(--text-sub);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .section-actions {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .btn-mini {
      min-height: 34px;
      padding: 0 12px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      border: 1px solid var(--border);
      background: var(--bg-card);
      color: var(--text);
    }
    .btn-mini.gold {
      background: var(--gold-dim);
      border-color: var(--gold-border);
      color: var(--gold-bright);
    }
    .btn-mini.primary {
      background: var(--gold);
      border-color: var(--gold);
      color: #111318;
    }
    .btn-mini.active {
      background: var(--gold);
      border-color: var(--gold);
      color: #111318;
    }
    .btn-mini.teal {
      background: var(--teal-dim);
      border-color: var(--teal-border);
      color: var(--teal-bright);
    }
    .btn-mini.amber {
      background: var(--amber-dim);
      border-color: var(--amber-border);
      color: #fbbf24;
    }

    .edit-hint {
      font-size: 11px;
      color: var(--gold-bright);
      background: var(--gold-dim);
      border: 1px dashed var(--gold-border);
      border-radius: 10px;
      padding: 7px 10px;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    /* Menu Cards Grid (Basics & Etude Books) */
    .menu-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-bottom: 18px;
    }

    .menu-card {
      position: relative;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 13px 12px 11px;
      text-align: left;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 98px;
      transition: border-color 0.15s, background 0.15s, transform 0.15s, box-shadow 0.15s;
    }
    .menu-card:hover { background: var(--bg-card-hover); }
    .menu-card.done-today {
      border-color: var(--gold-border);
      background: linear-gradient(160deg, rgba(212,175,55,0.13) 0%, var(--bg-card) 75%);
    }
    .menu-card.editing {
      border-style: dashed;
      border-color: rgba(212, 175, 55, 0.55);
      touch-action: none;
      padding-top: 24px;
    }
    .menu-card.dragging {
      opacity: 0.45;
      transform: scale(0.96);
    }
    .menu-card.drag-over {
      border: 2px solid var(--gold-bright);
      box-shadow: 0 0 0 3px rgba(212, 175, 55, 0.25);
    }

    .card-grip {
      position: absolute;
      top: 5px;
      left: 8px;
      font-size: 13px;
      color: var(--text-sub);
      letter-spacing: -1px;
      pointer-events: none;
    }

    .card-del-btn {
      position: absolute;
      top: -7px;
      right: -7px;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: var(--danger);
      color: #fff;
      font-size: 16px;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.45);
      z-index: 5;
    }

    .card-top-row {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 6px;
      margin-bottom: 6px;
    }

    .card-title {
      font-size: 14px;
      font-weight: 700;
      color: var(--text);
      line-height: 1.3;
      word-break: break-word;
    }

    .done-check {
      flex-shrink: 0;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: var(--gold);
      color: #111318;
      font-size: 12px;
      font-weight: 900;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .card-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 4px;
      font-size: 11px;
      color: var(--text-sub);
      margin-top: auto;
    }

    .bpm-chip {
      font-weight: 700;
      color: var(--gold-bright);
    }

    .elapsed-chip {
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 999px;
      background: rgba(255,255,255,0.06);
      color: var(--text-sub);
    }
    .elapsed-chip.warn {
      background: var(--amber-dim);
      color: #fbbf24;
    }
    .elapsed-chip.today {
      background: var(--gold-dim);
      color: var(--gold-bright);
    }

    /* Etude Book Specific */
    .etude-book-card {
      grid-column: span 2;
      min-height: 86px;
    }

    .etude-progress-wrap {
      margin-top: 8px;
    }

    .etude-progress-bar {
      height: 6px;
      background: rgba(255,255,255,0.08);
      border-radius: 999px;
      overflow: hidden;
      margin-bottom: 6px;
    }

    .etude-progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--gold), var(--gold-bright));
      border-radius: 999px;
    }

    .etude-badges {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .badge-mini {
      font-size: 11px;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 999px;
      background: rgba(255,255,255,0.07);
      color: var(--text-sub);
    }
    .badge-mini.warn {
      background: var(--amber-dim);
      color: #fbbf24;
      border: 1px solid var(--amber-border);
    }
    .badge-mini.gold {
      background: var(--gold-dim);
      color: var(--gold-bright);
    }
    .badge-mini.green {
      background: var(--green-dim);
      color: var(--green);
    }

    /* Etude Level 2: Number Grid */
    .etude-sub-header {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 12px;
      margin-bottom: 12px;
    }

    .etude-sub-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 8px;
    }

    .back-btn {
      min-height: 34px;
      padding: 0 10px;
      border-radius: 9px;
      background: var(--bg-input);
      border: 1px solid var(--border);
      font-size: 12px;
      font-weight: 700;
      color: var(--text);
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .etude-sub-title {
      font-size: 15px;
      font-weight: 800;
      color: var(--gold-bright);
      margin-bottom: 6px;
    }

    .filter-row {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-bottom: 12px;
    }

    .filter-pill {
      min-height: 34px;
      padding: 0 11px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      background: var(--bg-card);
      border: 1px solid var(--border);
      color: var(--text-sub);
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .filter-pill.active {
      background: var(--gold);
      border-color: var(--gold);
      color: #111318;
    }
    .filter-pill.active-amber {
      background: var(--amber);
      border-color: var(--amber);
      color: #111318;
    }

    .etude-num-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-bottom: 18px;
    }
    @media (min-width: 480px) {
      .etude-num-grid { grid-template-columns: repeat(5, 1fr); }
    }

    .num-tile {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 11px;
      padding: 8px 6px 7px;
      min-height: 76px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      text-align: center;
      position: relative;
    }
    .num-tile.practiced {
      background: #202532;
      border-color: rgba(255,255,255,0.16);
    }
    .num-tile.target-unreached {
      background: linear-gradient(160deg, rgba(245, 158, 11, 0.16) 0%, var(--bg-card) 85%);
      border-color: var(--amber-border);
    }
    .num-tile.target-reached {
      background: linear-gradient(160deg, rgba(52, 211, 153, 0.13) 0%, var(--bg-card) 85%);
      border-color: rgba(52, 211, 153, 0.48);
    }
    .num-tile.done-today {
      box-shadow: 0 0 0 1.5px var(--gold);
    }

    .num-tile-no {
      font-size: 15px;
      font-weight: 800;
      color: var(--text);
      line-height: 1.1;
    }
    .num-tile-bpm {
      font-size: 11px;
      font-weight: 700;
      color: var(--text-sub);
      line-height: 1.2;
      white-space: nowrap;
    }
    .num-tile.target-unreached .num-tile-bpm { color: #fbbf24; }
    .num-tile.target-reached .num-tile-bpm { color: var(--green); }
    .num-tile.practiced:not(.target-unreached):not(.target-reached) .num-tile-bpm { color: var(--gold-bright); }

    .num-tile-days {
      font-size: 10px;
      color: var(--text-muted);
    }
    .num-tile.done-today .num-tile-days { color: var(--gold-bright); font-weight: 700; }

    .num-dot-today {
      position: absolute;
      top: 5px;
      right: 5px;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--gold);
    }

    /* Scale Controls & Uniform 24-Key Grid */
    .scale-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 10px;
    }

    .scale-group-label {
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.04em;
      margin: 12px 0 8px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .scale-group-label.major { color: var(--gold-bright); }
    .scale-group-label.minor { color: var(--teal-bright); }

    .scale-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 12px;
    }

    .scale-tile {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 6px 5px 6px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      height: 114px; /* Strict uniform height across ALL 24 keys */
      text-align: left;
      position: relative;
      overflow: hidden;
    }
    .scale-tile.major {
      border-top: 2px solid rgba(212, 175, 55, 0.45);
    }
    .scale-tile.minor {
      border-top: 2px solid rgba(77, 182, 172, 0.45);
    }
    .scale-tile.done-today.major {
      border-color: var(--gold-bright);
      background: linear-gradient(170deg, rgba(212,175,55,0.16) 0%, var(--bg-card) 80%);
    }
    .scale-tile.done-today.minor {
      border-color: var(--teal-bright);
      background: linear-gradient(170deg, rgba(77,182,172,0.16) 0%, var(--bg-card) 80%);
    }

    .scale-tile-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 3px;
      min-height: 19px;
      padding: 0 1px;
    }

    .scale-key-name {
      font-size: 15px;
      font-weight: 800;
      line-height: 1.1;
      white-space: nowrap;
    }
    .scale-key-name.compact {
      font-size: 12.5px;
      letter-spacing: -0.02em;
    }
    .scale-tile.major .scale-key-name { color: var(--gold-bright); }
    .scale-tile.minor .scale-key-name { color: var(--teal-bright); }

    .scale-acc-badge {
      font-size: 10px;
      font-weight: 700;
      color: var(--text-sub);
      background: rgba(255,255,255,0.06);
      padding: 1px 5px;
      border-radius: 6px;
      white-space: nowrap;
    }
    .scale-acc-badge.compact {
      font-size: 9px;
      padding: 1px 4px;
    }

    .scale-staff-box {
      width: 100%;
      height: 50px; /* Identical graphic height across all 24 keys; spacious for stacked ♯6/♭6 */
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.24);
      border-radius: 7px;
      margin: 3px 0;
      overflow: hidden;
    }

    .scale-staff-box svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    .scale-tile-foot {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 10px;
      color: var(--text-sub);
      min-height: 14px;
      padding: 0 1px;
    }

    /* Today's Logs List */
    .log-list-card {
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 12px;
      margin-top: 8px;
    }

    .log-item {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
      padding: 10px 0;
      border-bottom: 1px solid var(--border-soft);
    }
    .log-item:last-child { border-bottom: none; padding-bottom: 2px; }

    .log-main { flex: 1; min-width: 0; }
    .log-title-line {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
      margin-bottom: 3px;
    }

    .cat-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .cat-dot.basic { background: var(--gold); }
    .cat-dot.scale { background: var(--teal); }
    .cat-dot.etude { background: var(--amber); }

    .log-name {
      font-size: 14px;
      font-weight: 700;
      color: var(--text);
    }

    .log-meta-line {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      font-size: 12px;
      color: var(--text-sub);
    }

    .log-memo {
      margin-top: 4px;
      font-size: 12px;
      color: var(--text-sub);
      word-break: break-word;
    }

    .log-actions {
      display: flex;
      align-items: center;
      gap: 4px;
      flex-shrink: 0;
    }

    .icon-btn {
      width: 34px;
      height: 34px;
      border-radius: 9px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      color: var(--text-sub);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
    }
    .icon-btn.danger:hover { color: #fca5a5; border-color: rgba(239,68,68,0.45); }

    /* Analytics */
    .card-panel {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px;
      margin-bottom: 12px;
    }

    .panel-title {
      font-size: 14px;
      font-weight: 800;
      color: var(--text);
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .stacked-bar {
      height: 14px;
      border-radius: 999px;
      background: var(--bg-input);
      overflow: hidden;
      display: flex;
      margin: 10px 0 12px;
    }
    .bar-seg.basic { background: var(--gold); }
    .bar-seg.scale { background: var(--teal); }
    .bar-seg.etude { background: var(--amber); }

    .legend-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .legend-box {
      background: var(--bg-input);
      border-radius: 10px;
      padding: 8px;
      text-align: center;
    }
    .legend-label { font-size: 11px; color: var(--text-sub); }
    .legend-val { font-size: 15px; font-weight: 800; margin-top: 2px; }
    .legend-pct { font-size: 11px; color: var(--text-muted); }

    .rank-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .rank-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      background: var(--bg-input);
      border: 1px solid var(--border);
      border-radius: 11px;
      padding: 10px 12px;
      width: 100%;
      text-align: left;
    }
    .rank-row:hover { background: var(--bg-card-hover); }

    .rank-left {
      display: flex;
      flex-direction: column;
      gap: 2px;
      min-width: 0;
    }
    .rank-name {
      font-size: 13px;
      font-weight: 700;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .rank-sub {
      font-size: 11px;
      color: var(--text-sub);
    }

    .coverage-grid {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 5px;
      margin-bottom: 8px;
    }

    .cov-cell {
      border-radius: 8px;
      padding: 6px 2px;
      text-align: center;
      border: 1px solid var(--border);
      background: var(--bg-input);
      min-height: 46px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
    }
    .cov-cell.major.lv3 { background: rgba(212,175,55,0.32); border-color: var(--gold-bright); }
    .cov-cell.major.lv2 { background: rgba(212,175,55,0.18); border-color: var(--gold-border); }
    .cov-cell.major.lv1 { background: rgba(212,175,55,0.08); border-color: rgba(212,175,55,0.25); }
    .cov-cell.minor.lv3 { background: rgba(77,182,172,0.32); border-color: var(--teal-bright); }
    .cov-cell.minor.lv2 { background: rgba(77,182,172,0.18); border-color: var(--teal-border); }
    .cov-cell.minor.lv1 { background: rgba(77,182,172,0.08); border-color: rgba(77,182,172,0.25); }

    .cov-key { font-size: 11px; font-weight: 800; line-height: 1.1; }
    .cov-key.compact { font-size: 9.5px; }
    .cov-cell.major .cov-key { color: var(--gold-bright); }
    .cov-cell.minor .cov-key { color: var(--teal-bright); }
    .cov-sub { font-size: 9px; color: var(--text-sub); }

    /* Calendar */
    .cal-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }

    .cal-weekdays {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      text-align: center;
      font-size: 11px;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    .cal-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 5px;
    }

    .cal-cell {
      aspect-ratio: 1 / 1;
      border-radius: 10px;
      background: var(--bg-input);
      border: 1px solid transparent;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 700;
      color: var(--text-sub);
    }
    .cal-cell.empty { background: transparent; pointer-events: none; }
    .cal-cell.hm1 { background: rgba(212,175,55,0.14); color: var(--text); }
    .cal-cell.hm2 { background: rgba(212,175,55,0.28); color: var(--text); }
    .cal-cell.hm3 { background: rgba(212,175,55,0.48); color: #fff; }
    .cal-cell.hm4 { background: rgba(212,175,55,0.78); color: #111318; }
    .cal-cell.is-today { border-color: var(--teal-bright); }
    .cal-cell.selected { border: 2px solid #fff; box-shadow: 0 0 0 2px rgba(212,175,55,0.4); }
    .cal-min { font-size: 9px; opacity: 0.85; font-weight: 600; margin-top: 1px; }

    /* Settings */
    .setting-btn-row {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .action-btn {
      min-height: 48px;
      border-radius: 12px;
      padding: 10px 14px;
      font-size: 14px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--bg-input);
      border: 1px solid var(--border);
      color: var(--text);
      width: 100%;
    }
    .action-btn.gold {
      background: var(--gold-dim);
      border-color: var(--gold-border);
      color: var(--gold-bright);
    }
    .action-btn.danger {
      background: var(--danger-dim);
      border-color: rgba(239, 68, 68, 0.45);
      color: #fca5a5;
    }

    /* Bottom Navigation */
    .bottom-nav {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 40;
      background: rgba(18, 21, 28, 0.96);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-top: 1px solid var(--border);
      padding-bottom: var(--safe-bottom);
    }

    .bottom-nav-inner {
      max-width: 560px;
      margin: 0 auto;
      height: var(--nav-height);
      display: grid;
      grid-template-columns: repeat(4, 1fr);
    }

    .nav-tab {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      color: var(--text-muted);
      font-size: 11px;
      font-weight: 700;
    }
    .nav-tab.active { color: var(--gold-bright); }
    .nav-icon { font-size: 19px; line-height: 1; }

    /* Modals / Bottom Sheets */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 80;
      background: rgba(0, 0, 0, 0.68);
      display: none;
      pointer-events: none;
      align-items: flex-end;
      justify-content: center;
    }
    .modal-backdrop.open {
      display: flex;
      pointer-events: auto;
    }

    .sheet {
      width: 100%;
      max-width: 560px;
      max-height: 92vh;
      overflow-y: auto;
      background: #181c24;
      border-top-left-radius: 22px;
      border-top-right-radius: 22px;
      border-top: 1px solid var(--border);
      padding: 14px 16px calc(18px + var(--safe-bottom));
      box-shadow: 0 -10px 40px rgba(0,0,0,0.6);
    }

    .sheet-handle {
      width: 40px;
      height: 4px;
      border-radius: 999px;
      background: rgba(255,255,255,0.2);
      margin: 0 auto 12px;
    }

    .sheet-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 12px;
    }

    .sheet-title {
      font-size: 17px;
      font-weight: 800;
      color: var(--text);
    }

    .close-btn {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: var(--bg-card);
      border: 1px solid var(--border);
      color: var(--text-sub);
      font-size: 18px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    /* Etude Number Quick Switcher in Sheet */
    .etude-sheet-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      background: var(--bg-input);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 6px 8px;
      margin-bottom: 12px;
    }

    .etude-nav-step {
      min-height: 34px;
      padding: 0 10px;
      border-radius: 8px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      font-size: 12px;
      font-weight: 700;
      color: var(--text);
    }
    .etude-nav-step:disabled { opacity: 0.35; pointer-events: none; }

    .etude-nav-current {
      font-size: 14px;
      font-weight: 800;
      color: var(--gold-bright);
    }

    .sheet-scale-banner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      background: var(--bg-input);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 8px 12px;
      margin-bottom: 12px;
    }
    .sheet-scale-banner .staff-lg {
      width: 162px;
      height: 66px;
      flex-shrink: 0;
    }

    /* Form Controls */
    .field-block {
      margin-bottom: 14px;
    }

    .field-label-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 6px;
    }

    .field-label {
      font-size: 12px;
      font-weight: 700;
      color: var(--text-sub);
    }

    .stepper-row {
      display: grid;
      grid-template-columns: 46px 46px 1fr 46px 46px;
      gap: 6px;
      align-items: center;
    }

    .step-btn {
      min-height: 44px;
      border-radius: 10px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      font-size: 13px;
      font-weight: 800;
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .step-btn:active { background: var(--bg-card-hover); }

    .num-input {
      width: 100%;
      min-height: 44px;
      border-radius: 10px;
      background: var(--bg-input);
      border: 1px solid var(--border);
      text-align: center;
      font-size: 18px;
      font-weight: 800;
      color: var(--gold-bright);
      outline: none;
    }
    .num-input:focus { border-color: var(--gold); }
    .num-input:disabled { opacity: 0.4; }

    .text-input, .text-area {
      width: 100%;
      border-radius: 10px;
      background: var(--bg-input);
      border: 1px solid var(--border);
      padding: 10px 12px;
      font-size: 16px; /* 16px prevents iOS Safari zoom on focus */
      color: var(--text);
      outline: none;
    }
    .text-input:focus, .text-area:focus { border-color: var(--gold); }

    .chip-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 8px;
    }

    .chip-btn {
      min-height: 34px;
      padding: 0 11px;
      border-radius: 999px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      font-size: 12px;
      font-weight: 700;
      color: var(--text-sub);
    }
    .chip-btn.active {
      background: var(--gold-dim);
      border-color: var(--gold-border);
      color: var(--gold-bright);
    }
    .chip-btn.tag-active {
      background: var(--teal-dim);
      border-color: var(--teal-border);
      color: var(--teal-bright);
    }

    /* Unified Timer Panel (with Tap-to-Type 4-digit MMSS) */
    .timer-panel {
      background: var(--bg-input);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    .timer-clock-shell {
      position: relative;
      width: 100%;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.03);
      border: 1.5px solid var(--border);
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: border-color 0.15s, background 0.15s, box-shadow 0.15s;
    }
    .timer-clock-shell.is-running {
      border-color: var(--gold-border);
      background: rgba(212, 175, 55, 0.06);
    }
    .timer-clock-shell.is-editing {
      border-color: var(--gold-bright);
      background: rgba(212, 175, 55, 0.12);
      box-shadow: 0 0 0 3px rgba(212, 175, 55, 0.22);
    }

    .timer-clock-display {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 36px;
      font-weight: 800;
      letter-spacing: 0.06em;
      color: var(--text);
      line-height: 1.15;
      pointer-events: none;
    }
    .timer-clock-shell.is-running .timer-clock-display,
    .timer-clock-shell.is-editing .timer-clock-display {
      color: var(--gold-bright);
    }

    .timer-tap-caption {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 2px;
      pointer-events: none;
    }
    .timer-clock-shell.is-editing .timer-tap-caption {
      color: var(--gold-bright);
      font-weight: 700;
    }

    /* Transparent full-surface numeric input for instant iOS numeric keypad */
    .timer-direct-input {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      opacity: 0;
      font-size: 16px; /* Prevents iOS zoom */
      cursor: text;
      border: none;
      background: transparent;
      caret-color: transparent;
    }

    .timer-controls-row {
      width: 100%;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
    }

    .timer-main-btn {
      min-height: 44px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      background: var(--gold-dim);
      border: 1px solid var(--gold-border);
      color: var(--gold-bright);
    }
    .timer-main-btn.running {
      background: var(--amber-dim);
      border-color: var(--amber-border);
      color: #fbbf24;
    }

    .timer-reset-btn {
      min-height: 44px;
      padding: 0 14px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 700;
      background: var(--bg-card);
      border: 1px solid var(--border);
      color: var(--text-sub);
    }

    /* Target BPM Box */
    .target-status-hint {
      font-size: 11px;
      font-weight: 700;
      margin-top: 6px;
      padding: 5px 9px;
      border-radius: 8px;
    }
    .target-status-hint.unreached {
      background: var(--amber-dim);
      color: #fbbf24;
    }
    .target-status-hint.reached {
      background: var(--green-dim);
      color: var(--green);
    }

    .toggle-inline {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      font-weight: 700;
      color: var(--text-sub);
      cursor: pointer;
    }
    .toggle-inline input {
      width: 17px;
      height: 17px;
      accent-color: var(--gold);
    }

    .sheet-footer {
      display: flex;
      gap: 8px;
      margin-top: 16px;
    }

    .btn-save {
      flex: 1;
      min-height: 48px;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--gold) 0%, var(--gold-bright) 100%);
      color: #111318;
      font-size: 15px;
      font-weight: 800;
      box-shadow: 0 4px 14px rgba(212, 175, 55, 0.3);
    }

    .btn-cancel {
      min-height: 48px;
      padding: 0 16px;
      border-radius: 12px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      color: var(--text-sub);
      font-size: 14px;
      font-weight: 700;
    }

    /* Metronome Bar inside BPM Field */
    .metro-bar {
      margin-top: 8px;
      background: var(--bg-input);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 8px 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .metro-bar.playing {
      border-color: var(--gold-border);
      background: rgba(212, 175, 55, 0.07);
    }
    .metro-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      flex-wrap: wrap;
    }
    .metro-play-btn {
      min-height: 36px;
      padding: 0 13px;
      border-radius: 9px;
      font-size: 12.5px;
      font-weight: 800;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: var(--gold-dim);
      border: 1px solid var(--gold-border);
      color: var(--gold-bright);
    }
    .metro-play-btn.playing {
      background: var(--amber-dim);
      border-color: var(--amber-border);
      color: #fbbf24;
    }
    .metro-opts {
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .metro-opt-btn {
      min-height: 34px;
      padding: 0 9px;
      border-radius: 8px;
      font-size: 11.5px;
      font-weight: 700;
      background: var(--bg-card);
      border: 1px solid var(--border);
      color: var(--text-sub);
    }
    .metro-opt-btn:hover { color: var(--text); }
    .metro-dots {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 12px;
    }
    .metro-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.14);
      transition: transform 0.06s ease-out, background 0.06s ease-out, box-shadow 0.06s ease-out;
    }
    .metro-dot.accent-beat {
      border: 1px solid rgba(212, 175, 55, 0.45);
    }
    .metro-dot.lit {
      background: var(--teal-bright);
      transform: scale(1.3);
      box-shadow: 0 0 10px rgba(112, 212, 202, 0.75);
    }
    .metro-dot.lit-accent {
      background: var(--gold-bright);
      transform: scale(1.45);
      box-shadow: 0 0 12px rgba(232, 199, 94, 0.9);
    }

    #confirmModal {
      z-index: 95;
    }

    /* Confirm Dialog */
    .dialog-card {
      width: calc(100% - 32px);
      max-width: 380px;
      margin: auto;
      background: #1b202a;
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 18px;
      box-shadow: 0 12px 40px rgba(0,0,0,0.65);
    }
    .dialog-title { font-size: 16px; font-weight: 800; margin-bottom: 8px; }
    .dialog-msg { font-size: 13px; color: var(--text-sub); margin-bottom: 16px; line-height: 1.5; }
    .dialog-actions { display: flex; gap: 8px; justify-content: flex-end; }

    /* Toast */
    .toast-container {
      position: fixed;
      left: 14px;
      right: 14px;
      bottom: calc(var(--nav-height) + var(--safe-bottom) + 12px);
      z-index: 120;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      pointer-events: none;
    }

    .toast {
      pointer-events: auto;
      max-width: 520px;
      width: 100%;
      background: #232836;
      border: 1px solid var(--gold-border);
      color: var(--text);
      border-radius: 12px;
      padding: 10px 14px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.55);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      font-size: 13px;
      font-weight: 600;
    }

    .toast-undo-btn {
      padding: 6px 12px;
      border-radius: 8px;
      background: var(--gold);
      color: #111318;
      font-size: 12px;
      font-weight: 800;
      flex-shrink: 0;
    }

    .empty-state {
      text-align: center;
      padding: 24px 12px;
      color: var(--text-muted);
      font-size: 13px;
    }

    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div class="app-shell">
    <header class="top-header">
      <div class="header-row">
        <div class="brand">
          <span class="brand-dot"></span>
          <span>SaxLog</span>
        </div>
        <div class="date-nav" id="headerDateNav">
          <button type="button" class="date-nav-btn" data-action="shift-date" data-delta="-1" aria-label="前日">◀</button>
          <button type="button" class="date-label-btn" data-action="go-today" id="headerDateLabel">----/--/--</button>
          <button type="button" class="date-nav-btn" data-action="shift-date" data-delta="1" aria-label="翌日">▶</button>

  <input type="file" id="jsonFileInput" accept="application/json,.json" class="hidden" />
  <div class="toast-container" id="toastContainer"></div>

  <script>
  (function () {
    'use strict';

    /* ========================
       Constants & Definitions
       ======================== */
    const STORAGE_KEY = 'saxlog_v5_data';
    const LEGACY_KEYS = ['saxlog_v4_data', 'saxlog_v3_data', 'saxlog_data'];
    const WEEKDAYS = ['日', '月', '火', '水', '木', '金', '土'];

    const SCALES = [
      // Major (12) - Uppercase
      { id: 'sc_C',   name: 'C',      mode: 'major', fifth: 0,  chroma: 0,  accType: 'none',  accCount: 0, badge: '0' },
      { id: 'sc_G',   name: 'G',      mode: 'major', fifth: 1,  chroma: 7,  accType: 'sharp', accCount: 1, badge: '♯1' },
      { id: 'sc_D',   name: 'D',      mode: 'major', fifth: 2,  chroma: 2,  accType: 'sharp', accCount: 2, badge: '♯2' },
      { id: 'sc_A',   name: 'A',      mode: 'major', fifth: 3,  chroma: 9,  accType: 'sharp', accCount: 3, badge: '♯3' },
      { id: 'sc_E',   name: 'E',      mode: 'major', fifth: 4,  chroma: 4,  accType: 'sharp', accCount: 4, badge: '♯4' },
      { id: 'sc_B',   name: 'B',      mode: 'major', fifth: 5,  chroma: 11, accType: 'sharp', accCount: 5, badge: '♯5' },
      { id: 'sc_Fs',  name: 'F♯/G♭', mode: 'major', fifth: 6,  chroma: 6,  accType: 'both6', accCount: 6, badge: '♯6/♭6' },
      { id: 'sc_Db',  name: 'D♭',    mode: 'major', fifth: 7,  chroma: 1,  accType: 'flat',  accCount: 5, badge: '♭5' },
      { id: 'sc_Ab',  name: 'A♭',    mode: 'major', fifth: 8,  chroma: 8,  accType: 'flat',  accCount: 4, badge: '♭4' },
      { id: 'sc_Eb',  name: 'E♭',    mode: 'major', fifth: 9,  chroma: 3,  accType: 'flat',  accCount: 3, badge: '♭3' },
      { id: 'sc_Bb',  name: 'B♭',    mode: 'major', fifth: 10, chroma: 10, accType: 'flat',  accCount: 2, badge: '♭2' },
      { id: 'sc_F',   name: 'F',      mode: 'major', fifth: 11, chroma: 5,  accType: 'flat',  accCount: 1, badge: '♭1' },
      // Minor (12) - Lowercase
      { id: 'sc_am',  name: 'a',      mode: 'minor', fifth: 0,  chroma: 9,  accType: 'none',  accCount: 0, badge: '0' },
      { id: 'sc_em',  name: 'e',      mode: 'minor', fifth: 1,  chroma: 4,  accType: 'sharp', accCount: 1, badge: '♯1' },
      { id: 'sc_bm',  name: 'b',      mode: 'minor', fifth: 2,  chroma: 11, accType: 'sharp', accCount: 2, badge: '♯2' },
      { id: 'sc_fsm', name: 'f♯',    mode: 'minor', fifth: 3,  chroma: 6,  accType: 'sharp', accCount: 3, badge: '♯3' },
      { id: 'sc_csm', name: 'c♯',    mode: 'minor', fifth: 4,  chroma: 1,  accType: 'sharp', accCount: 4, badge: '♯4' },
      { id: 'sc_gsm', name: 'g♯',    mode: 'minor', fifth: 5,  chroma: 8,  accType: 'sharp', accCount: 5, badge: '♯5' },
      { id: 'sc_dsm', name: 'd♯/e♭', mode: 'minor', fifth: 6,  chroma: 3,  accType: 'both6', accCount: 6, badge: '♯6/♭6' },
      { id: 'sc_bbm', name: 'b♭',    mode: 'minor', fifth: 7,  chroma: 10, accType: 'flat',  accCount: 5, badge: '♭5' },
      { id: 'sc_fm',  name: 'f',      mode: 'minor', fifth: 8,  chroma: 5,  accType: 'flat',  accCount: 4, badge: '♭4' },
      { id: 'sc_cm',  name: 'c',      mode: 'minor', fifth: 9,  chroma: 0,  accType: 'flat',  accCount: 3, badge: '♭3' },
      { id: 'sc_gm',  name: 'g',      mode: 'minor', fifth: 10, chroma: 7,  accType: 'flat',  accCount: 2, badge: '♭2' },
      { id: 'sc_dm',  name: 'd',      mode: 'minor', fifth: 11, chroma: 2,  accType: 'flat',  accCount: 1, badge: '♭1' }
    ];

    const SCALE_MAP = {};
    SCALES.forEach(s => { SCALE_MAP[s.id] = s; });

    function getDefaultData() {
      return {
        version: 5,
        basics: [
          { id: 'b_longtone',  name: 'ロングトーン',           defaultBpm: 60,   defaultDuration: 10 },
          { id: 'b_overtone',  name: '倍音・オーバートーン',   defaultBpm: null, defaultDuration: 10 },
          { id: 'b_tonguing',  name: 'タンギング',             defaultBpm: 100,  defaultDuration: 10 },
          { id: 'b_dynamics',  name: 'ダイナミクス・サブトーン', defaultBpm: 60, defaultDuration: 10 },
          { id: 'b_vibrato',   name: 'ビブラート',             defaultBpm: 72,   defaultDuration: 5  },
          { id: 'b_altissimo', name: 'アルティッシモ・フラジオ', defaultBpm: null, defaultDuration: 10 }
        ],
        etudes: [
          { id: 'e_ferling', name: 'フェルリング（48の練習曲）', hasNumbers: true,  startNum: 1, endNum: 48, defaultBpm: 96,  defaultDuration: 15 },
          { id: 'e_lacour',  name: 'ラクール（50の練習曲）',     hasNumbers: true,  startNum: 1, endNum: 50, defaultBpm: 100, defaultDuration: 15 },
          { id: 'e_mule',    name: 'ミュール（練習曲集）',       hasNumbers: false, startNum: 1, endNum: 1,  defaultBpm: 100, defaultDuration: 15 }
        ],
        etudeTargets: {},
        logs: [],
        ui: {
          scaleSort: 'fifths',
          scaleFilter: 'all',
          etudeNumberFilter: 'all',
          analyticsPeriod: 7,
          metroBeats: 4,
          metroSubdiv: 1
        }
      };
    }

    /* ========================
       Utility Helpers
       ======================== */
    function escapeHtml(str) {
      return String(str == null ? '' : str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function toDateStr(dateObj) {
      const y = dateObj.getFullYear();
      const m = String(dateObj.getMonth() + 1).padStart(2, '0');
      const d = String(dateObj.getDate()).padStart(2, '0');
      return `${y}-${m}-${d}`;
    }

    function todayStr() {
      return toDateStr(new Date());
    }

    function parseDateStr(str) {
      const p = String(str).split('-').map(Number);
      return new Date(p[0], (p[1] || 1) - 1, p[2] || 1);
    }

    function addDays(dateStr, delta) {
      const d = parseDateStr(dateStr);
      d.setDate(d.getDate() + delta);
      return toDateStr(d);
    }

    function diffDays(olderDateStr, newerDateStr) {
      if (!olderDateStr) return null;
      const a = parseDateStr(olderDateStr);
      const b = parseDateStr(newerDateStr || todayStr());
      return Math.round((b.getTime() - a.getTime()) / 86400000);
    }

    function formatDisplayDate(dateStr) {
      const d = parseDateStr(dateStr);
      return `${d.getFullYear()}/${d.getMonth() + 1}/${d.getDate()}(${WEEKDAYS[d.getDay()]})`;
    }

    function formatElapsedLabel(days) {
      if (days === null || days === undefined) return '未実施';
      if (days <= 0) return '今日';
      if (days === 1) return '昨日';
      return `${days}日前`;
    }

    function getLogSeconds(log) {
      if (log.durationSec !== undefined && log.durationSec !== null && !isNaN(Number(log.durationSec))) {
        return Math.max(0, Math.round(Number(log.durationSec)));
      }
      return Math.max(0, Math.round((Number(log.duration) || 0) * 60));
    }

    function sumSecondsToMinutes(logs) {
      const totalSec = logs.reduce((sum, l) => sum + getLogSeconds(l), 0);
      if (totalSec === 0) return 0;
      return Math.max(1, Math.round(totalSec / 60));
    }

    function formatDurationLabel(sec) {
      const s = Math.max(0, Math.round(sec || 0));
      if (s === 0) return '時間なし';
      const mins = Math.floor(s / 60);
      const rem = s % 60;
      if (mins === 0) return `${rem}秒`;
      if (rem === 0) return `${mins}分`;
      return `${mins}分${rem}秒`;
    }

    function uid(prefix) {
      return `${prefix}_${Date.now().toString(36)}_${Math.random().toString(36).slice(2, 7)}`;
    }

    function etudeTargetKey(etudeId, num) {
      return (num !== null && num !== undefined && num !== '') ? `${etudeId}#${num}` : `${etudeId}`;
    }

    /* ========================
       Storage & Migration
       ======================== */
    function sanitizeData(raw) {
      const def = getDefaultData();
      if (!raw || typeof raw !== 'object') return def;

      const basics = Array.isArray(raw.basics) && raw.basics.length >= 0
        ? raw.basics.filter(x => x && x.id && x.name).map(x => ({
            id: String(x.id),
            name: String(x.name),
            defaultBpm: (x.defaultBpm === null || x.defaultBpm === '' || isNaN(Number(x.defaultBpm))) ? null : Number(x.defaultBpm),
            defaultDuration: Math.max(0, Number(x.defaultDuration) || 10)
          }))
        : def.basics;

      const etudes = Array.isArray(raw.etudes) && raw.etudes.length >= 0
        ? raw.etudes.filter(x => x && x.id && x.name).map(x => {
            const isFerlingLegacy = x.name.includes('フェルリング') && x.hasNumbers === undefined;
            const isLacourLegacy = x.name.includes('ラクール') && x.hasNumbers === undefined;
            const hasNumbers = x.hasNumbers !== undefined ? Boolean(x.hasNumbers) : (isFerlingLegacy || isLacourLegacy);
            const startNum = Math.max(1, Number(x.startNum) || 1);
            const endNum = hasNumbers
              ? Math.max(startNum, Number(x.endNum) || (isFerlingLegacy ? 48 : 50))
              : 1;
            return {
              id: String(x.id),
              name: String(x.name),
              hasNumbers,
              startNum,
              endNum,
              defaultBpm: (x.defaultBpm === null || x.defaultBpm === '' || isNaN(Number(x.defaultBpm))) ? 100 : Number(x.defaultBpm),
              defaultDuration: Math.max(0, Number(x.defaultDuration) || 15)
            };
          })
        : def.etudes;

      const etudeTargets = {};
      if (raw.etudeTargets && typeof raw.etudeTargets === 'object') {
        Object.keys(raw.etudeTargets).forEach(k => {
          const v = Number(raw.etudeTargets[k]);
          if (v > 0 && isFinite(v)) etudeTargets[k] = Math.round(v);
        });
      }

      const logs = Array.isArray(raw.logs)
        ? raw.logs.filter(l => l && l.date && l.category && l.itemId).map(l => {
            const sec = (l.durationSec !== undefined && l.durationSec !== null && !isNaN(Number(l.durationSec)))
              ? Math.max(0, Math.round(Number(l.durationSec)))
              : Math.max(0, Math.round((Number(l.duration) || 0) * 60));
            return {
              id: String(l.id || uid('log')),
              date: String(l.date),
              category: String(l.category),
              itemId: String(l.itemId),
              itemName: String(l.itemName || ''),
              etudeNum: (l.etudeNum !== null && l.etudeNum !== undefined && l.etudeNum !== '') ? Number(l.etudeNum) : null,
              bpm: (l.bpm !== null && l.bpm !== undefined && l.bpm !== '' && !isNaN(Number(l.bpm))) ? Number(l.bpm) : null,
              targetBpm: (l.targetBpm !== null && l.targetBpm !== undefined && l.targetBpm !== '' && !isNaN(Number(l.targetBpm))) ? Number(l.targetBpm) : null,
              durationSec: sec,
              duration: sec > 0 ? Math.max(1, Math.round(sec / 60)) : 0,
              tags: Array.isArray(l.tags) ? l.tags.map(String) : [],
              memo: String(l.memo || ''),
              createdAt: Number(l.createdAt) || Date.now()
            };
          })
        : [];

      const ui = {
        scaleSort: (raw.ui && raw.ui.scaleSort === 'chromatic') ? 'chromatic' : 'fifths',
        scaleFilter: (raw.ui && ['all', 'major', 'minor'].includes(raw.ui.scaleFilter)) ? raw.ui.scaleFilter : 'all',
        etudeNumberFilter: (raw.ui && ['all', 'unreached', 'review', 'untouched'].includes(raw.ui.etudeNumberFilter)) ? raw.ui.etudeNumberFilter : 'all',
        analyticsPeriod: (raw.ui && Number(raw.ui.analyticsPeriod) === 30) ? 30 : 7,
        metroBeats: (raw.ui && [0, 2, 3, 4, 6].includes(Number(raw.ui.metroBeats))) ? Number(raw.ui.metroBeats) : 4,
        metroSubdiv: (raw.ui && [1, 2, 3, 4].includes(Number(raw.ui.metroSubdiv))) ? Number(raw.ui.metroSubdiv) : 1
      };

      return { version: 5, basics, etudes, etudeTargets, logs, ui };
    }

    function loadData() {
      try {
        const s = localStorage.getItem(STORAGE_KEY);
        if (s) return sanitizeData(JSON.parse(s));
        for (const k of LEGACY_KEYS) {
          const old = localStorage.getItem(k);
          if (old) {
            const migrated = sanitizeData(JSON.parse(old));
            localStorage.setItem(STORAGE_KEY, JSON.stringify(migrated));
            return migrated;
          }
        }
      } catch (e) {
        console.warn('Storage load error, falling back to default:', e);
      }
      return getDefaultData();
    }

    function saveData() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state.data));
      } catch (e) {
        showToast('保存に失敗しました（端末容量を確認してください）');
      }
    }

    /* ========================
       Application State
       ======================== */
    const state = {
      data: loadData(),
      activeTab: 'record',      // 'record' | 'analytics' | 'history' | 'settings'
      activePillar: 'basic',    // 'basic' | 'scale' | 'etude'
      selectedDate: todayStr(),
      editMode: false,
      activeEtudeBookId: null,  // Level 2 Etude Number Grid ID
      calendarMonth: (() => {
        const now = new Date();
        return { year: now.getFullYear(), month: now.getMonth() };
      })(),
      calendarSelectedDate: todayStr(),
      // Active Log Modal Draft
      logDraft: null,
      // Unified Timer state inside log modal
      timer: {
        running: false,
        startedAt: 0,
        accumulatedMs: 0,
        intervalId: null,
        editing: false,
        editDigits: ''
      },
      // Metronome engine state (Web Audio API)
      metro: {
        playing: false,
        ctx: null,
        timerId: null,
        nextNoteTime: 0,
        stepIndex: 0,
        visualTimeouts: []
      },
      // Undo buffer
      lastDeletedMenu: null,
      toastTimerId: null,
      // Pending confirm callback
      confirmCallback: null,
      // Drag / Flick reorder state
      drag: null
    };

    /* ========================
       Key Signature SVG Builder
       (Uniform 116x50 box; stacked full-width ♯6 / ♭6 for maximum readability!)
       ======================== */
    const STD_LINES    = [13, 18.5, 24, 29.5, 35];
    const STD_SHARP_YS = [13, 21.25, 10.25, 18.5, 26.75];   // F5, C5, G5, D5, A4
    const STD_FLAT_YS  = [24, 15.75, 26.75, 18.5, 29.5];    // B4, E5, A4, D5, G4

    const TOP_LINES    = [5.5, 8.9, 12.3, 15.7, 19.1];      // step 3.4 (height 13.6)
    const TOP_SHARP_YS = [5.5, 10.6, 3.8, 8.9, 14.0, 7.2];  // F5, C5, G5, D5, A4, E5
    const BOT_LINES    = [30.9, 34.3, 37.7, 41.1, 44.5];    // step 3.4 (height 13.6)
    const BOT_FLAT_YS  = [37.7, 32.6, 39.4, 34.3, 41.1, 36.0]; // B4, E5, A4, D5, G4, C5

    function svgLines(ys, x1, x2, stroke, sw) {
      return ys.map(y => `<line x1="${x1}" y1="${y}" x2="${x2}" y2="${y}" stroke="${stroke}" stroke-width="${sw}" />`).join('');
    }

    // Treble clef path authored for staff lines y=11..31 (height 20)
    const TREBLE_CLEF_PATH = 'M 6.2 35.5 C 4.2 36.2 3.2 34.4 4.4 33.4 C 5.5 32.5 7.2 33.6 6.8 35.0 C 6.6 35.8 7.5 35.5 7.7 33.8 L 8.9 7.2 C 9.0 4.6 7.0 3.8 5.9 5.5 C 4.8 7.2 5.6 11.2 8.2 14.2 C 10.6 17.0 3.0 20.8 3.2 26.2 C 3.4 30.2 6.8 31.6 9.6 30.3 C 12.2 29.0 12.6 25.4 10.4 23.6 C 8.4 22.0 5.9 23.3 6.0 25.6 C 6.1 27.3 7.4 28.0 8.5 27.6';

    function svgTrebleClef(x, yOffset, scale, color, strokeWidth) {
      return `
        <g transform="translate(${x}, ${yOffset}) scale(${scale})" fill="none" stroke="${color}" stroke-linecap="round" stroke-linejoin="round">
          <path d="${TREBLE_CLEF_PATH}" stroke-width="${strokeWidth}" />
        </g>`;
    }

    function svgSharp(x, y, scale, color) {
      return `
        <g transform="translate(${x}, ${y}) scale(${scale})" stroke="${color}" stroke-linecap="round">
          <line x1="-1.55" y1="-4.7" x2="-1.55" y2="4.9" stroke-width="1.05" />
          <line x1="1.65"  y1="-5.3" x2="1.65"  y2="4.3" stroke-width="1.05" />
          <line x1="-3.4"  y1="-1.2" x2="3.5"   y2="-2.4" stroke-width="1.45" />
          <line x1="-3.4"  y1="2.2"  x2="3.5"   y2="1.0"  stroke-width="1.45" />
        </g>`;
    }

    function svgFlat(x, y, scale, color) {
      return `
        <g transform="translate(${x}, ${y}) scale(${scale})" fill="none" stroke="${color}" stroke-linecap="round" stroke-linejoin="round">
          <line x1="-1.6" y1="-6.8" x2="-1.6" y2="2.8" stroke-width="1.15" />
          <path d="M -1.6 -0.8 C 2.0 -2.9 3.4 -0.1 1.9 1.6 C 0.8 2.7 -0.6 3.0 -1.6 2.8" stroke-width="1.25" />
        </g>`;
    }

    function buildKeySignatureSvg(scale) {
      const isMajor = scale.mode === 'major';
      const ink = isMajor ? '#e8c75e' : '#70d4ca';
      const staffColor = 'rgba(255,255,255,0.28)';

      // ♯6 / ♭6: Stacked top & bottom using FULL horizontal width inside identical 116x50 box!
      if (scale.accType === 'both6') {
        const sharpNotes = TOP_SHARP_YS.map((y, i) => svgSharp(28 + i * 14, y, 0.78, ink)).join('');
        const flatNotes  = BOT_FLAT_YS.map((y, i)  => svgFlat(28 + i * 14, y, 0.78, ink)).join('');
        return `
          <svg viewBox="0 0 116 50" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            ${svgLines(TOP_LINES, 3, 113, staffColor, 0.7)}
            ${svgTrebleClef(6, -1.98, 0.68, ink, 1.85)}
            ${sharpNotes}
            <line x1="6" y1="24.8" x2="110" y2="24.8" stroke="rgba(255,255,255,0.22)" stroke-width="0.85" stroke-dasharray="2.5 2.5" />
            ${svgLines(BOT_LINES, 3, 113, staffColor, 0.7)}
            ${svgTrebleClef(6, 23.42, 0.68, ink, 1.85)}
            ${flatNotes}
          </svg>`;
      }

      // Standard single staff (C / a has NO natural symbol!)
      let accs = '';
      if (scale.accType === 'sharp') {
        for (let i = 0; i < scale.accCount; i++) {
          accs += svgSharp(32 + i * 13.5, STD_SHARP_YS[i], 1.1, ink);
        }
      } else if (scale.accType === 'flat') {
        for (let i = 0; i < scale.accCount; i++) {
          accs += svgFlat(32 + i * 13.5, STD_FLAT_YS[i], 1.1, ink);
        }
      }

      return `
        <svg viewBox="0 0 116 50" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          ${svgLines(STD_LINES, 5, 111, staffColor, 0.9)}
          ${svgTrebleClef(8, 0.9, 1.1, ink, 1.45)}
          ${accs}
        </svg>`;
    }

    /* ========================
       Stats Computation Helpers
       ======================== */
    function getLogsForDate(dateStr) {
      return state.data.logs
        .filter(l => l.date === dateStr)
        .sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
    }

    function getItemStats(category, itemId, etudeNum) {
      const matched = state.data.logs.filter(l => {
        if (l.category !== category || l.itemId !== itemId) return false;
        if (etudeNum !== undefined && etudeNum !== null) {
          return Number(l.etudeNum) === Number(etudeNum);
        }
        return true;
      });

      if (matched.length === 0) {
        return { count: 0, lastDate: null, lastBpm: null, maxBpm: null, lastDurationSec: 0, elapsedDays: null };
      }

      matched.sort((a, b) => {
        if (a.date !== b.date) return b.date.localeCompare(a.date);
        return (b.createdAt || 0) - (a.createdAt || 0);
      });

      const latest = matched[0];
      let lastBpm = null;
      let maxBpm = null;
      for (const l of matched) {
        if (l.bpm !== null && l.bpm !== undefined) {
          if (lastBpm === null) lastBpm = l.bpm;
          if (maxBpm === null || l.bpm > maxBpm) maxBpm = l.bpm;
        }
      }

      return {
        count: matched.length,
        lastDate: latest.date,
        lastBpm,
        maxBpm,
        lastDurationSec: getLogSeconds(latest),
        elapsedDays: diffDays(latest.date, todayStr())
      };
    }

    function getEtudeBookSummary(book) {
      const total = book.hasNumbers ? (book.endNum - book.startNum + 1) : 1;
      const practicedSet = new Set();
      let unreachedCount = 0;
      let lastLog = null;

      const bookLogs = state.data.logs
        .filter(l => l.category === 'etude' && l.itemId === book.id)
        .sort((a, b) => (a.date !== b.date ? b.date.localeCompare(a.date) : (b.createdAt || 0) - (a.createdAt || 0)));

      if (bookLogs.length > 0) lastLog = bookLogs[0];

      if (book.hasNumbers) {
        for (let n = book.startNum; n <= book.endNum; n++) {
          const st = getItemStats('etude', book.id, n);
          if (st.count > 0) practicedSet.add(n);
          const tBpm = state.data.etudeTargets[etudeTargetKey(book.id, n)] || null;
          if (tBpm && (st.lastBpm === null || st.lastBpm < tBpm)) {
            unreachedCount++;
          }
        }
      } else {
        const st = getItemStats('etude', book.id, null);
        if (st.count > 0) practicedSet.add(1);
        const tBpm = state.data.etudeTargets[etudeTargetKey(book.id, null)] || null;
        if (tBpm && (st.lastBpm === null || st.lastBpm < tBpm)) {
          unreachedCount = 1;
        }
      }

      return {
        total,
        practicedCount: practicedSet.size,
        unreachedCount,
        lastLog,
        elapsedDays: lastLog ? diffDays(lastLog.date, todayStr()) : null
      };
    }

    function isDoneOnDate(dateStr, category, itemId, etudeNum) {
      return state.data.logs.some(l =>
        l.date === dateStr &&
        l.category === category &&
        l.itemId === itemId &&
        (etudeNum === undefined || etudeNum === null ? true : Number(l.etudeNum) === Number(etudeNum))
      );
    }

    /* ========================
       Unified Timer + 4-Digit MMSS Direct Input
       ======================== */
    function resetTimerState(initialSec) {
      stopTimerInterval();
      state.timer = {
        running: false,
        startedAt: 0,
        accumulatedMs: Math.max(0, Math.round(initialSec || 0)) * 1000,
        intervalId: null,
        editing: false,
        editDigits: ''
      };
    }

    function stopTimerInterval() {
      if (state.timer.intervalId) {
        clearInterval(state.timer.intervalId);
        state.timer.intervalId = null;
      }
    }

    function getTimerElapsedMs() {
      if (!state.timer.running) return state.timer.accumulatedMs;
      return state.timer.accumulatedMs + Math.max(0, Date.now() - state.timer.startedAt);
    }

    function formatClock(ms) {
      const totalSec = Math.floor(Math.max(0, ms) / 1000);
      const mins = Math.floor(totalSec / 60);
      const secs = totalSec % 60;
      return `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
    }

    function formatEditingDigits(digits) {
      if (!digits) return formatClock(state.timer.accumulatedMs);
      const padded = digits.padStart(4, '0');
      return `${padded.slice(0, 2)}:${padded.slice(2, 4)}`;
    }

    function commitTimerDirectInput() {
      if (!state.timer.editing) return;
      if (state.timer.editDigits.length > 0) {
        const padded = state.timer.editDigits.padStart(4, '0');
        const mm = parseInt(padded.slice(0, 2), 10) || 0;
        const ss = parseInt(padded.slice(2, 4), 10) || 0;
        state.timer.accumulatedMs = (mm * 60 + ss) * 1000;
      }
      state.timer.editing = false;
      state.timer.editDigits = '';
      updateTimerDom();
      updateMetronomeDom();
    }

    function updateTimerDom() {
      const shell = document.getElementById('sheetTimerShell');
      const clockEl = document.getElementById('sheetTimerClock');
      const captionEl = document.getElementById('sheetTimerCaption');
      const mainBtn = document.getElementById('sheetTimerToggleBtn');

      if (!shell || !clockEl) return;

      shell.classList.toggle('is-running', state.timer.running);
      shell.classList.toggle('is-editing', state.timer.editing);

      if (state.timer.editing) {
        clockEl.textContent = formatEditingDigits(state.timer.editDigits);
        if (captionEl) captionEl.textContent = '4桁で入力中（例：1000 → 10:00 ／ 0530 → 05:30）';
      } else {
        clockEl.textContent = formatClock(getTimerElapsedMs());
        if (captionEl) captionEl.textContent = state.timer.running ? '計測中（タップで停止して4桁入力）' : 'タップして4桁で直接入力（MMSS）';
      }

      if (mainBtn) {
        mainBtn.classList.toggle('running', state.timer.running);
        mainBtn.textContent = state.timer.running ? '⏸ 一時停止' : (state.timer.accumulatedMs > 0 ? '▶ 再開' : '▶ スタート');
      }
    }

    function toggleTimerStartStop() {
      // If user was typing 4 digits, commit first
      if (state.timer.editing) {
        const inp = document.getElementById('sheetTimerDirectInput');
        if (inp) inp.blur();
        commitTimerDirectInput();
      }

      if (!state.timer.running) {
        state.timer.running = true;
        state.timer.startedAt = Date.now();
        stopTimerInterval();
        state.timer.intervalId = setInterval(updateTimerDom, 250);
      } else {
        state.timer.accumulatedMs = getTimerElapsedMs();
        state.timer.running = false;
        stopTimerInterval();
      }
      updateTimerDom();
    }

    function resetTimerDisplay() {
      const inp = document.getElementById('sheetTimerDirectInput');
      if (inp) {
        inp.value = '';
        if (state.timer.editing) inp.blur();
      }
      resetTimerState(0);
      updateTimerDom();
    }

    /* ========================
       Metronome Engine (Web Audio API lookahead scheduler)
       ======================== */
    const METRO_BEAT_CYCLE = [4, 3, 2, 6, 0];
    const METRO_SUBDIV_LABELS = { 1: '♩ 4分', 2: '♪ 8分', 3: '3連', 4: '♬ 16分' };

    function getCurrentMetroBpm() {
      const inp = document.getElementById('sheetBpmInput');
      const raw = inp ? parseInt(inp.value, 10) : (state.logDraft ? state.logDraft.bpm : 80);
      const val = (!isNaN(raw) && raw >= 20 && raw <= 300) ? raw : (state.logDraft ? state.logDraft.bpm : 80);
      return Math.max(20, Math.min(300, val || 80));
    }

    function ensureAudioContext() {
      // Allow playback even when iPhone physical silent switch is on (iOS 17+ Safari)
      if (navigator.audioSession) {
        try { navigator.audioSession.type = 'playback'; } catch (_) {}
      }
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      if (!AudioCtx) return null;
      if (!state.metro.ctx) {
        state.metro.ctx = new AudioCtx();
      }
      if (state.metro.ctx.state === 'suspended') {
        state.metro.ctx.resume().catch(() => {});
      }
      // Play a 1-sample silent buffer to unlock iOS WebKit audio reliably inside user gesture
      try {
        const buf = state.metro.ctx.createBuffer(1, 1, 22050);
        const src = state.metro.ctx.createBufferSource();
        src.buffer = buf;
        src.connect(state.metro.ctx.destination);
        src.start(0);
      } catch (_) {}
      return state.metro.ctx;
    }

    function scheduleMetronomeClick(ctx, time, kind) {
      // kind: 'accent' | 'beat' | 'sub'
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();

      if (kind === 'accent') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(1480, time);
        osc.frequency.exponentialRampToValueAtTime(880, time + 0.028);
        gain.gain.setValueAtTime(0.001, time);
        gain.gain.linearRampToValueAtTime(0.85, time + 0.002);
        gain.gain.exponentialRampToValueAtTime(0.001, time + 0.045);
      } else if (kind === 'beat') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(980, time);
        osc.frequency.exponentialRampToValueAtTime(640, time + 0.025);
        gain.gain.setValueAtTime(0.001, time);
        gain.gain.linearRampToValueAtTime(0.68, time + 0.002);
        gain.gain.exponentialRampToValueAtTime(0.001, time + 0.038);
      } else {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(1680, time);
        gain.gain.setValueAtTime(0.001, time);
        gain.gain.linearRampToValueAtTime(0.32, time + 0.002);
        gain.gain.exponentialRampToValueAtTime(0.001, time + 0.022);
      }

      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(time);
      osc.stop(time + 0.06);
    }

    function flashMetronomeDot(beatIdx, isAccent) {
      const dots = document.querySelectorAll('#sheetMetroDots .metro-dot');
      if (!dots.length) return;
      dots.forEach((dot, idx) => {
        dot.classList.remove('lit', 'lit-accent');
        if (idx === beatIdx) {
          dot.classList.add(isAccent ? 'lit-accent' : 'lit');
        }
      });
    }

    function runMetronomeScheduler() {
      if (!state.metro.playing || !state.metro.ctx) return;
      const ctx = state.metro.ctx;
      const scheduleAhead = 0.12;

      while (state.metro.nextNoteTime < ctx.currentTime + scheduleAhead) {
        const bpm = getCurrentMetroBpm();
        const beatsPerBar = state.data.ui.metroBeats || 0;
        const subdiv = state.data.ui.metroSubdiv || 1;
        const step = state.metro.stepIndex;
        const isMainBeat = (step % subdiv) === 0;
        const beatNumber = Math.floor(step / subdiv);
        const beatInBar = beatsPerBar > 0 ? (beatNumber % beatsPerBar) : 0;
        const isAccent = isMainBeat && beatsPerBar > 0 && beatInBar === 0;

        const kind = isAccent ? 'accent' : (isMainBeat ? 'beat' : 'sub');
        const noteTime = state.metro.nextNoteTime;
        scheduleMetronomeClick(ctx, noteTime, kind);

        if (isMainBeat) {
          const delayMs = Math.max(0, (noteTime - ctx.currentTime) * 1000);
          const dotIdx = beatsPerBar > 0 ? beatInBar : (beatNumber % 2);
          const tid = setTimeout(() => {
            if (state.metro.playing) flashMetronomeDot(dotIdx, isAccent);
          }, delayMs);
          state.metro.visualTimeouts.push(tid);
        }

        const secondsPerStep = (60.0 / bpm) / subdiv;
        state.metro.nextNoteTime += secondsPerStep;
        state.metro.stepIndex++;
      }
    }

    function startMetronome() {
      if (state.logDraft && state.logDraft.noTempo) return;
      const ctx = ensureAudioContext();
      if (!ctx) {
        showToast('このブラウザではメトロノームを再生できません');
        return;
      }
      state.metro.playing = true;
      state.metro.stepIndex = 0;
      state.metro.nextNoteTime = ctx.currentTime + 0.04;
      if (state.metro.timerId) clearInterval(state.metro.timerId);
      state.metro.timerId = setInterval(runMetronomeScheduler, 25);
      runMetronomeScheduler();
      updateMetronomeDom();
    }

    function stopMetronome() {
      state.metro.playing = false;
      if (state.metro.timerId) {
        clearInterval(state.metro.timerId);
        state.metro.timerId = null;
      }
      state.metro.visualTimeouts.forEach(id => clearTimeout(id));
      state.metro.visualTimeouts = [];
      updateMetronomeDom();
    }

    function toggleMetronome() {
      if (state.metro.playing) stopMetronome();
      else startMetronome();
    }

    function cycleMetroBeats() {
      const cur = state.data.ui.metroBeats;
      const idx = METRO_BEAT_CYCLE.indexOf(cur);
      state.data.ui.metroBeats = METRO_BEAT_CYCLE[(idx + 1) % METRO_BEAT_CYCLE.length];
      state.metro.stepIndex = 0;
      saveData();
      updateMetronomeDom();
    }

    function cycleMetroSubdiv() {
      const cur = state.data.ui.metroSubdiv || 1;
      state.data.ui.metroSubdiv = (cur % 4) + 1;
      state.metro.stepIndex = 0;
      saveData();
      updateMetronomeDom();
    }

    function updateMetronomeDom() {
      const bar = document.getElementById('sheetMetroBar');
      const playBtn = document.getElementById('sheetMetroPlayBtn');
      const beatBtn = document.getElementById('sheetMetroBeatBtn');
      const subBtn = document.getElementById('sheetMetroSubBtn');
      const dotsEl = document.getElementById('sheetMetroDots');
      if (!bar) return;

      const beats = state.data.ui.metroBeats;
      const subdiv = state.data.ui.metroSubdiv || 1;
      const playing = state.metro.playing;

      bar.classList.toggle('playing', playing);
      if (playBtn) {
        playBtn.classList.toggle('playing', playing);
        playBtn.textContent = playing ? '⏹ 停止' : '🔔 メトロノーム';
      }
      if (beatBtn) {
        beatBtn.textContent = beats === 0 ? '拍子: なし' : `${beats}拍子`;
      }
      if (subBtn) {
        subBtn.textContent = METRO_SUBDIV_LABELS[subdiv] || '♩ 4分';
      }
      if (dotsEl) {
        const dotCount = beats > 0 ? beats : 2;
        dotsEl.innerHTML = Array.from({ length: dotCount }, (_, i) =>
          `<span class="metro-dot ${beats > 0 && i === 0 ? 'accent-beat' : ''}"></span>`
        ).join('');
      }
    }
